# =====================================================================
#  Nobody Lies · 사건 저작 서식
# =====================================================================
#  이 파일은 **그대로 검증을 통과하는 최소 사건**이다. 빈 양식이 아니다.
#
#      cp templates/case-template.yaml cases/my-case.yaml
#      npm run verify -w engine -- --case cases/my-case.yaml
#
#  통과하는 상태에서 시작해 한 항목씩 바꾸고 그때마다 검증기를 돌린다.
#  빈 양식을 채우다 200개 오류를 한꺼번에 만나는 것보다 훨씬 싸다.
#
#  ── 채우는 순서가 중요하다 ──────────────────────────────────
#    숨은 범죄  →  동기가 여기서 나온다
#    트릭      →  물증을 결정한다
#    인물 배치  →  ★ 기회가 여기서 결정된다. 가장 중요
#    물증      →  거짓말의 반박 근거
#    사실      →  검증기의 원자 단위
#    조사      →  탐색 공간
#    보고서     →  공란 = 진실 세계의 필드
#    산문      →  마지막. 사실이 다 확정된 뒤에
#
#  거꾸로 채우면 반드시 다시 쓴다. 산문을 먼저 쓰면 특히 그렇다.
#  규모 기준은 templates/README.md 참조. 아래는 daily(2장·7공란).
#
#  ★ 용의자는 언제나 5명이다 ★ 규모가 바뀌어도 이 수만은 안 바뀐다.
#  손잡이가 아니라 UI 계약이다 — SYSTEM-DECISIONS.md §3 (2026-07-29 개정).
# =====================================================================

id: my-case
title: 사건 제목
scale: daily
# 예산은 마지막에 정한다. 검증기가 오라클·탐욕 회차를 알려주면 그때 맞춘다.
# 기대 6 + 여유 1 = 7. 6으로 두면 「좌절 위험」 경고가 상주한다 —
# 무고한 넷 전원에게 레드 헤링을 주므로 5명 사건은 예산이 6 아래로 안 내려간다
budget: 7

incident:
  kind: homicide          # homicide | theft | leak | forgery | disappearance | sabotage | audit
  subject: victim
  description: 한 줄로. 무엇이 벌어졌는가
  # 사건 현장. 무고한 자가 사망 시간대에 여기 있으면 기회가 생겨 유일성이 무너진다.
  # 검증기가 그것을 검사하므로 locations 의 id 여야 한다
  scene: room

prose:
  source: authored        # authored | template | llm

# 진술 정독만으로 확보되는 단어. 조사가 필요 없다.
# ★ 1장처럼 조사 없이 확정되어야 하는 장에 확보 공란이 있으면 반드시 필요하다 ★
seed_terms: [만년필]


# ─────────────────────────────────────────────────────────────────────
#  시간 축
# ─────────────────────────────────────────────────────────────────────
#  presence · claim · 시각 공란이 이 어휘만 쓴다. 진술 격자의 열이기도 하다.
#  너무 잘게 쪼개지 마라 — 격자가 읽히지 않는다.

slots:
  - { id: t0, label: 전날 밤 }
  - { id: t1, label: 새벽, window: true }   # window = 사망 추정 구간
  - { id: t2, label: 아침 }


# ─────────────────────────────────────────────────────────────────────
#  장소
# ─────────────────────────────────────────────────────────────────────
#  presence · claim · 장소 공란이 이 어휘만 쓴다.
#  자유 문자열로 두면 'room' 과 '방'이 서로 다른 곳이 되고 아무도 모른다.
#  at_lodge: false = 사건 부지 밖. 사망 시간대에 거기 있으면 현장 접근이 불가능하다.

locations:
  - { id: hall, label: 홀,   at_lodge: true }
  - { id: room, label: 방,   at_lodge: true }   # ← 사건 현장
  - { id: away, label: 자택, at_lodge: false }


# ─────────────────────────────────────────────────────────────────────
#  인물과 동선
# ─────────────────────────────────────────────────────────────────────
#  ★ 이 게임에서 범인을 특정하는 것은 동기가 아니라 기회다 ★
#  동기는 여러 명이 갖는다(레드 헤링). 기회는 범인만 가져야 한다.
#
#  presence = 실제 동선(진실).  claim = 진술에서 주장하는 동선.
#  ★ claim 을 적지 않으면 presence 와 같다 ★
#  즉 "무고한 사람은 거짓말하지 않는다"가 규약이 아니라 **기본값**이다.
#  거짓말은 명시적으로 적어야 하고, 검증기가 범인 외에는 적지 못하게 막는다.
#
#  people 은 **용의자 목록**이다. 피해자는 넣지 않는다(유죄를 계산하게 된다).
#  실존 인물명을 쓰지 마라.

people:
  - id: p1
    name: 인물 하나
    age: 34
    job: 직업
    hidden_role: ringleader     # ringleader | accomplice | coerced | investigator | unaware
    presence:
      - { slot: t0, at: hall }
      - { slot: t1, at: room }  # ← 범행
      - { slot: t2, at: hall }
    claim:
      - { slot: t0, at: hall }
      - { slot: t1, at: hall }  # ← 이 사건의 유일한 거짓말
      - { slot: t2, at: hall }
    statement:
      voice: 말이 느리고 남 이야기를 먼저 한다   # 산문가가 읽는다. 플레이어에겐 안 보인다
      paragraphs:
        - 진술 원문. 문단 단위로 적는다.
        # 문장은 "한 줄" 또는 { ko: …, en: … }. en 이 없으면 번역 전이다

  # 무고한 넷은 t2 에 함께 도착한다 = 사망 시간대에 현장에 없다 = 기회 없음.
  # ★ 넷 다 claim 을 적지 않는다 ★ 적는 순간 거짓말이 되고, 검증기가
  # 「무고한 사람은 거짓말하지 않는다」 위반으로 잡는다.
  - id: p2
    name: 인물 둘
    age: 29
    job: 직업
    hidden_role: unaware
    presence:
      - { slot: t2, at: hall }
    statement:
      voice: 불안하고 말이 빠르다
      paragraphs:
        - 진술 원문.

  - id: p3
    name: 인물 셋
    age: 41
    job: 직업
    hidden_role: unaware
    presence:
      - { slot: t2, at: hall }
    statement:
      voice: 짧게 끊어 말한다
      paragraphs:
        - 진술 원문.

  - id: p4
    name: 인물 넷
    age: 36
    job: 직업
    hidden_role: coerced
    presence:
      - { slot: t2, at: hall }
    statement:
      voice: 남 이야기부터 꺼낸다
      paragraphs:
        - 진술 원문.

  - id: p5
    name: 인물 다섯
    age: 44
    job: 직업
    hidden_role: investigator
    presence:
      - { slot: t2, at: hall }
    statement:
      voice: 시각과 순서를 또박또박 짚는다
      paragraphs:
        - 진술 원문.

victim: victim
culprit: p1


# ─────────────────────────────────────────────────────────────────────
#  트릭
# ─────────────────────────────────────────────────────────────────────
#  ★ 트릭은 이름표가 아니라 계약이다 ★
#  아키타입마다 요구하는 부품이 다르고 검증기가 강제한다.
#  원형을 늘리려면 `src/types.ts` 의 ARCHETYPES 에 계약을 추가한다.
#
#    staged_suicide      스스로 목숨을 끊었다        exit 필수 · death 인상 필수
#    locked_room         아무도 드나들 수 없었다      exit 필수
#    alibi_fabrication   그 시각 그 자리에 없었다     time 또는 absence 인상 필수
#    body_moved          발견된 곳에서 죽었다        place 인상 필수
#    delayed_mechanism   범인이 있을 때 벌어졌다      time 인상 필수
#    identity_swap       ⛔ 아직 못 쓴다 (용의자 목록이 거짓이 되면 공란 체계가 무너진다)
#
#  ★ 실제 추리물의 트릭은 대개 조합이다 ★ types 에 여럿 적으면 계약이 전부 적용된다.

trick:
  types: [alibi_fabrication]
  props: [e_tool]      # 트릭에 실제로 쓴 물건
  staging: []          # 위장하려고 심어둔 것

  # 플레이어가 처음 믿게 되는 것들.
  # ★ broken_by 가 없으면 그 착각에서 영영 빠져나올 수 없다 ★
  illusions:
    - id: il_absent
      kind: absence          # death | time | place | absence | identity
      impression: 범인은 그 시각 현장에 없었다
      made_by: []
      broken_by: [e_trace, e_log]

  # 현장이 닫혀 있다고 주장하는 아키타입(staged_suicide·locked_room)이라면
  # exit 이 **필수**다. 없으면 물리적으로 성립하지 않는다.
  # exit:
  #   slot: t2
  #   method: 어떻게 빠져나갔는가
  #   enabled_by: [e_something]
  #   broken_by: [e_something_else]

  flaw:
    text: 그 시각에 없었다면 왜 아침에 가장 먼저 알았는가
    # ★ 허점은 반드시 실제로 심긴 자리를 가리킨다 ★
    # 자유 텍스트로 두면 작가 머릿속에만 있는 허점을 적게 된다.
    # 물증 id 또는 인물 id(그 사람의 진술).
    planted_in: [p1]


# ─────────────────────────────────────────────────────────────────────
#  물증
# ─────────────────────────────────────────────────────────────────────
#  record 는 3인칭 관찰만 적는다.
#  ★ '위조' '가명' '밀폐' 같은 목적·기능 판정어 금지 ★ — 플레이어의 결론이다.
#
#  yields_terms = 확보 단어에 들어오는 후보. discovered 공란은 이걸로만 채운다.

evidence:
  - id: e_tool
    description: 만년필
    found_at: 방 안
    record: 바닥에 떨어져 있었다.
    yields_terms: [만년필]

  # ★ 핵심 사실은 획득 경로가 둘 이상이어야 한다 ★
  # 하나뿐이면 그 조사를 안 고른 플레이어가 영영 막힌다. 검증기가 강제한다.
  - id: e_toolmark
    description: 같은 폭의 자국
    record: 같은 폭의 자국이 남아 있었다.
    yields_terms: [만년필]

  - id: e_trace
    description: 새벽의 흔적
    record: 복도 끝에 젖은 자국이 남아 있었다.

  - id: e_log
    description: 출입 기록
    record: 문이 새벽에 한 번 여닫혔다.

  - id: e_alias
    description: 어떤 이름이 적힌 기록
    yields_terms: [가명]

  - id: e_alias2
    description: 같은 이름의 두 번째 기록
    yields_terms: [가명]

  - id: e_motive
    description: 금전 기록
    yields_terms: [채무 관계]

  - id: e_mutual
    description: 두 사람의 상호 보증
    record: 두 사람이 말한 도착 시각이 서로 맞물렸다.

  - id: e_herring1
    description: 개인적인 편지

  - id: e_herring2
    description: 오래된 사진

  - id: e_herring3
    description: 접힌 영수증

  - id: e_herring4
    description: 일부가 지워진 기록

  # ★ 범인(p1)의 것 — 2026-07-30에 **누설을 막으려고** 늘렸다 ★
  # 전에는 무고한 넷(p2~p5)만 소지품에서 무언가 나왔다. 그러면 소지품을 다섯 번
  # 눌러본 플레이어는 **빈손인 하나가 범인**이라는 것을 안다. 검증기 §9-3h 가 문다.
  # 범인도 사건과 무관한 것 하나를 갖는다 — 산장도 다섯 전원의 소지품에서 나온다.
  - id: e_herring5
    description: 낡은 명함


# ─────────────────────────────────────────────────────────────────────
#  사실
# ─────────────────────────────────────────────────────────────────────
#  검증기의 원자 단위. 유죄 = motive ∧ opportunity ∧ means.
#  revealed_by 가 비어 있으면 진술에서 무료로 얻는다.
#  ※ 쉼표가 든 값은 반드시 인용한다 — flow 스타일 { } 안에서 쉼표는 구분자다.

facts:
  - { id: f_opp, kind: opportunity, subject: p1,
      content: 새벽에 현장에 있었다, revealed_by: [e_trace, e_log] }

  # 무료 배제 — 1장이 조사 없이 확정되려면 필요하다. 무고한 넷 전원분
  - { id: f_no_p2, kind: no_opportunity, subject: p2, content: 아침에 도착, revealed_by: [] }
  - { id: f_no_p3, kind: no_opportunity, subject: p3, content: 아침에 도착, revealed_by: [] }
  - { id: f_no_p4, kind: no_opportunity, subject: p4, content: 아침에 도착, revealed_by: [] }
  - { id: f_no_p5, kind: no_opportunity, subject: p5, content: 아침에 도착, revealed_by: [] }

  # ★ 레드 헤링으로 의심을 산 인물은 물증으로도 닫아야 한다 ★
  # 자기 진술뿐이면 그를 범인으로 가정했을 때 배제가 통째로 사라진다.
  # 위의 무료 배제는 그대로 두고 확인 층을 얹는다.
  - { id: f_no_p2_ok, kind: no_opportunity, subject: p2, content: 도착 시각 상호 일치, revealed_by: [e_mutual] }
  - { id: f_no_p3_ok, kind: no_opportunity, subject: p3, content: 도착 시각 상호 일치, revealed_by: [e_mutual] }
  - { id: f_no_p4_ok, kind: no_opportunity, subject: p4, content: 도착 시각 상호 일치, revealed_by: [e_mutual] }
  - { id: f_no_p5_ok, kind: no_opportunity, subject: p5, content: 도착 시각 상호 일치, revealed_by: [e_mutual] }

  - { id: f_identity, kind: identity, subject: p1, content: 가명의 주인, revealed_by: [e_alias, e_alias2] }
  - { id: f_means, kind: means, subject: p1, content: 도구를 다룰 수 있었다, revealed_by: [e_tool, e_toolmark] }
  - { id: f_motive, kind: motive, subject: p1, content: 채무 관계, revealed_by: [e_motive], requires: [f_identity] }

  # 레드 헤링 — 무고한 사람의 비밀. 수상해 보이지만 사건과 무관하다.
  # ★ 무고한 넷 전원이 갖는다 ★ 하나라도 빠지면 그 사람만 깨끗해 보여서
  # 후보가 넷에서 셋으로 줄어든다. 지문·서사의 「전부 또는 전무」와 같은 이유다.
  - { id: f_h1, kind: context, subject: p2, content: 감추는 것이 있다, revealed_by: [e_herring1] }
  - { id: f_h2, kind: context, subject: p3, content: 감추는 것이 있다, revealed_by: [e_herring2] }
  - { id: f_h3, kind: context, subject: p4, content: 감추는 것이 있다, revealed_by: [e_herring3] }
  - { id: f_h4, kind: context, subject: p5, content: 감추는 것이 있다, revealed_by: [e_herring4] }
  # 범인도 하나 갖는다 — context 라 유죄 계산에는 안 낀다 (§9-3h)
  - { id: f_h5, kind: context, subject: p1, content: 감추는 것이 있다, revealed_by: [e_herring5] }


# ─────────────────────────────────────────────────────────────────────
#  조사
# ─────────────────────────────────────────────────────────────────────
#  salience = 플레이어가 초반에 이 조사를 고를 성향 (0~1)
#
#  ★ 범인의 salience 를 낮게 둔다 ★
#  가장 수상해 보이는 사람이 범인이면 게임이 안 된다.
#  레드 헤링을 높게, 해답을 낮게. 눈에 띄는 것부터 찍는 플레이어는 실패하고
#  추론한 플레이어가 이긴다.
#
#  ★ result 는 gives 바로 옆에 둔다 ★
#  "찾았다"고 말해놓고 아무것도 주지 않으면 플레이어가 예산만 잃는다.
#  **gives 가 있으면 result 는 필수다** — 검증기 §9-8e 가 오류로 세운다.
#  2026-07-28 에 그 검사가 생긴 뒤 이 파일이 여덟 군데서 걸려 있었다.
#  「그대로 통과하는 최소 사건」이라는 머리말이 거짓이 돼 있었고, 이 파일이
#  빌드 게이트에 없어서 조용했다 (2026-07-29 에 고쳤다).
#
#  ★ target 또는 pair 를 붙인다 ★ 없으면 화면에 걸리지 않아 실행할 수가 없다.
#  target.kind 는 location · fixture · person. fixture 는 평면도가 있어야 쓴다.
#
#  ★ 결과문은 전부 같은 온도로 쓴다 ★ solution 과 redherring 의 길이·어조가
#  다르면 그것이 곧 유용도 표시다. 여기서는 전부 한 문장으로 고정했다.

actions:
  - id: a_papers
    label: 서류 조사
    cost: 1
    gives: [e_alias, e_motive]
    salience: 0.55
    yield: solution           # solution | redherring | exclusion | empty
    verb: search              # belongings | search | phone | alibi | autopsy | fixture
    target: { kind: location, id: hall }
    result:
      title: 이름 하나가 반복된다
      body: 여러 장에 같은 이름이 적혀 있었다.

  - id: a_ledger
    label: 장부 조사
    cost: 1
    gives: [e_alias2]
    salience: 0.3
    yield: solution
    verb: search
    target: { kind: location, id: hall }
    result:
      title: 두 번째 기록
      body: 장부에 같은 이름이 한 번 더 적혀 있었다.

  - id: a_room
    label: 방 수색
    cost: 1
    gives: [e_tool]
    salience: 0.5
    yield: solution
    verb: search
    target: { kind: location, id: room }
    result:
      title: 바닥에 떨어진 것
      body: 방 바닥에 물건 하나가 떨어져 있었다.

  - id: a_body
    label: 시신 검사
    cost: 1
    gives: [e_toolmark]
    salience: 0.6
    yield: solution
    verb: autopsy
    target: { kind: fixture, id: body }
    result:
      title: 같은 폭의 자국
      body: 같은 폭으로 눌린 자국이 남아 있었다.

  - id: a_hall
    label: 복도 조사
    cost: 1
    gives: [e_trace]
    salience: 0.4
    yield: solution
    verb: search
    target: { kind: location, id: hall }
    result:
      title: 복도 끝의 자국
      body: 복도 끝에 젖은 자국이 남아 있었다.

  - id: a_door
    label: 출입 기록 조회
    cost: 1
    gives: [e_log]
    salience: 0.35
    yield: solution
    verb: fixture
    target: { kind: fixture, id: door }
    result:
      title: 새벽의 여닫힘
      body: 문이 새벽에 한 번 여닫힌 기록이 있었다.

  # 레드 헤링 — salience 를 해답보다 높게. 무고한 넷 전원분
  - id: a_h1
    label: 소지품 검사 · 인물 둘
    cost: 1
    gives: [e_herring1]
    salience: 0.85
    yield: redherring
    verb: belongings
    target: { kind: person, id: p2 }
    result:
      title: 개인적인 편지
      body: 소지품에서 개인적인 편지 한 통이 나왔다.

  - id: a_h2
    label: 소지품 검사 · 인물 셋
    cost: 1
    gives: [e_herring2]
    salience: 0.8
    yield: redherring
    verb: belongings
    target: { kind: person, id: p3 }
    result:
      title: 오래된 사진
      body: 소지품에서 오래된 사진 한 장이 나왔다.

  - id: a_h3
    label: 소지품 검사 · 인물 넷
    cost: 1
    gives: [e_herring3]
    salience: 0.75
    yield: redherring
    verb: belongings
    target: { kind: person, id: p4 }
    result:
      title: 접힌 영수증
      body: 소지품에서 접힌 영수증 한 장이 나왔다.

  - id: a_h4
    label: 소지품 검사 · 인물 다섯
    cost: 1
    gives: [e_herring4]
    salience: 0.7
    yield: redherring
    verb: belongings
    target: { kind: person, id: p5 }
    result:
      title: 지워진 기록
      body: 소지품에서 일부가 지워진 기록이 나왔다.

  # ★ 범인의 소지품 — **비워두면 그 빈자리가 곧 정답이다** (§9-3h)
  # 무고한 넷에만 레드 헤링을 달면, 소지품을 다섯 번 눌러본 플레이어가 답을 얻는다.
  # 범인도 **사건과 무관한** 것 하나를 갖는다 — 살인과 이어지는 것을 두면 안 된다.
  - id: a_h5
    label: 소지품 검사 · 인물 하나
    cost: 1
    gives: [e_herring5]
    salience: 0.65
    yield: redherring
    verb: belongings
    target: { kind: person, id: p1 }
    result:
      title: 낡은 명함
      body: 소지품에서 낡은 명함 한 장이 나왔다.

  # 짝 조사 — 장소가 없으므로 target 대신 pair 로 두 인물을 지정한다
  - id: a_alibi
    label: 알리바이 대조
    cost: 1
    gives: [e_mutual]
    salience: 0.45
    yield: exclusion
    verb: alibi
    pair: [p2, p3]
    result:
      title: 맞물리는 시각
      body: 네 사람이 말한 도착 시각이 서로 맞물렸다.

  # 빈손도 배제 정보다. 조사 대상은 예산의 3배 이상이어야 선택이 소거가 아니라 판단이 된다.
  # ★ 빈손은 result 가 없어도 된다 ★ 공통 폴백(「아무것도 없음」)이 맞는 유일한 자리다
  - { id: a_kitchen, label: 주방 수색,   cost: 1, gives: [], salience: 0.2,  yield: empty, verb: search, target: { kind: location, id: hall } }
  - { id: a_yard,    label: 마당 수색,   cost: 1, gives: [], salience: 0.15, yield: empty, verb: search, target: { kind: location, id: hall } }
  - { id: a_attic,   label: 다락 수색,   cost: 1, gives: [], salience: 0.1,  yield: empty, verb: search, target: { kind: location, id: hall } }
  - { id: a_car,     label: 차량 확인,   cost: 1, gives: [], salience: 0.12, yield: empty, verb: search, target: { kind: location, id: away } }
  - { id: a_cellar,  label: 지하 수색,   cost: 1, gives: [], salience: 0.18, yield: empty, verb: search, target: { kind: location, id: hall } }
  - { id: a_shed,    label: 창고 수색,   cost: 1, gives: [], salience: 0.14, yield: empty, verb: search, target: { kind: location, id: hall } }
  - { id: a_desk,    label: 책상 조사,   cost: 1, gives: [], salience: 0.22, yield: empty, verb: search, target: { kind: location, id: room } }
  - { id: a_bin,     label: 쓰레기 확인, cost: 1, gives: [], salience: 0.08, yield: empty, verb: search, target: { kind: location, id: hall } }
  - { id: a_phone,   label: 통화내역 조회, cost: 1, gives: [], salience: 0.28, yield: empty, verb: phone, target: { kind: person, id: p4 } }
  - { id: a_window,  label: 창가 조사,   cost: 1, gives: [], salience: 0.16, yield: empty, verb: fixture, target: { kind: fixture, id: window } }


# ─────────────────────────────────────────────────────────────────────
#  보고서 — 장과 공란
# ─────────────────────────────────────────────────────────────────────
#  ★ 공란 라벨은 고정 어휘에서만 고른다 ★ 어휘는 고정, 구성은 가변이다.
#    인물 · 장소 · 시각 · 도구 · 동기 · 정체 · 은폐수단 · 위장물
#    마지막목격자 · 접촉수단 · 은닉처 · 사인 · 물품 · 협박대상
#
#  ★ `공범` 은 폐기됐다 ★ 라벨이 존재한다는 사실만으로 "범인 말고 한 명 더
#  있다"가 조사 0회에 풀린다. 진실 세계의 accomplice 역할은 남지만 공란으로
#  묻지 않는다. (`docs/MEMORY.md` §1-1)
#
#  ★ 장소 공란의 답은 locations 의 id, 시각 공란의 답은 slots 의 id 다 ★
#  라벨을 쓰면 검증기가 잡는다.
#
#  ★ 장의 개수와 구성은 사건마다 달라야 한다 ★
#  모든 사건이 5장이고 4장이 항상 '감춰진 사건'이면 첫 화면에서 반전이 예측된다.
#
#  ★ 각 장은 그 시점의 가용 정보만으로 확정 가능해야 한다 ★
#  장 순서 = 의존성 순서다. 사건 시간순과 달라도 되고 epilogue_order 로 재배열된다.
#
#  opening = 장이 열릴 때 뜨는 절차 한 줄. 서술자 3인칭.
#  ★ 제목이 말하는 것 이상을 말하면 안 된다 ★ 답도 조사 방향도 금지.
#  ★ 전부 쓰거나 전부 비우거나 ★ 일부만 쓰면 그 유무가 신호가 된다.

chapters:
  - order: 1
    title: 아침의 발견
    opening: 먼저 그 아침에 무엇이 있었는지를 적는다.
    requires_facts: [f_no_p2, f_no_p3, f_no_p4, f_no_p5]
    blanks:
      - { label: 인물, candidates: closed,     answer: p2, particle: 이/가 }
      - { label: 장소, candidates: closed,     answer: room }
      - { label: 시각, candidates: closed,     answer: t2 }
      - { label: 도구, candidates: discovered, answer: 만년필, particle: 이/가 }
    # ★ 보고서 서술문 — 공란은 목록이 아니라 문장 안에 박힌다 ★
    #   문자열 = 텍스트 조각 · { blank: n } = 위 blanks 의 n번째 (0부터)
    #   검증기가 강제한다: 모든 공란이 정확히 한 번 참조돼야 한다.
    #   참조 없는 공란은 문맥 없이 뜨고, 두 번 참조하면 같은 답을 두 번 묻는다.
    #
    #   조사(particle)는 받침에 따라 갈리는 쌍을 적는다 — 이/가 · 을/를 · 은/는 ·
    #   과/와 · (으)로. 어느 쪽이 될지는 답이 정해져야 알 수 있으므로 렌더 시점에 고른다.
    #   ⚠ `였다`·`이었다` 처럼 받침에 갈리는 **어미**는 텍스트 조각에 쓰지 마라.
    #     조사와 달리 자동 처리 대상이 아니다. 손으로 쓴 사건에서 답이 고정일 때만 안전하다.
    report:
      - "그날 아침 "
      - { blank: 0 }
      - " 가장 먼저 도착했다. "
      - { blank: 2 }
      - ", "
      - { blank: 1 }
      - "에서 "
      - { blank: 3 }
      - " 발견됐다."
    epilogue_order: 1
    epilogue: 결말 조각. 최종 제출 후 시간순으로 재배열되어 하나의 이야기가 된다.

  - order: 2
    title: 이름과 이유
    opening: 남은 것은 이름과 이유다.
    requires_facts: [f_motive, f_opp, f_means]
    blanks:
      # is_accusation 은 사건 전체에 정확히 하나. 조합 수 30 이상이어야 찍기가 막힌다
      - { label: 인물, candidates: closed,     answer: p1, is_accusation: true }
      - { label: 정체, candidates: discovered, answer: 가명 }
      - { label: 동기, candidates: discovered, answer: 채무 관계 }
    report:
      - "모든 정황이 한 사람을 가리켰다. 진범은 "
      - { blank: 0 }
      - ". 기록에 남은 이름은 "
      - { blank: 1 }
      - ", 그리고 그를 움직인 것은 "
      - { blank: 2 }
      - "."
    epilogue_order: 2
    epilogue: 결말 조각. 트릭과 동기가 여기서 다 밝혀져야 한다.

reopen_per_chapter: 1


# ─────────────────────────────────────────────────────────────────────
#  정보 공개
# ─────────────────────────────────────────────────────────────────────
#  트리거는 둘뿐 — 장 완성, 조사 실행.
#  yield: path 결정적 / narrow 좁힘 / decoy 참이지만 무관 / flavor 분위기
#
#  ★ decoy 는 fact 를 주면 안 된다 ★ 주는 순간 필수 경로가 되어 함정이 아니게 된다.
#  ★ 추가 진술은 자기 비밀을 말하지 않는다 ★ 남에 대해서, 또는 사건 전반에 대해서만.
#
#  narration = 장 사이 인터루드의 서술.
#  ★ 도착한 것만 말하고 도착물끼리의 관계는 말하지 않는다 ★
#  `그리고`·`그러나`는 되지만 `그래서`·`따라서`는 안 된다 — 인과를 이으면 추론을 대신한다.
#  ★ 인물의 태도·표정을 묘사하지 않는다 ★ 분위기는 무대에 얹는다.
#     (decoy 인물만 주목하게 하면 "서술자가 머무는 인물은 범인이 아니다"가 학습된다)

reveals:
  - trigger: { on: chapterComplete, chapter_order: 1 }
    yield: path
    actions: [a_ledger]
    surface: map            # statement | map | graph | suspect | overview
    narration: 아침의 정황이 정리됐다. 장부가 한 권 더 있다는 것을 알게 됐다.


# ─────────────────────────────────────────────────────────────────────
#  산문
# ─────────────────────────────────────────────────────────────────────
#  ★ 프롤로그는 브리핑과 진술에 이미 있는 사실만 다룬다. 새 정보는 0 ★
#  분위기 살리려고 "그녀는 위험한 일에 연루되어 있었다" 한 줄 넣으면
#  조사로 얻어야 할 정보가 무료로 풀리고 난이도가 무너진다.
#  트릭의 허점을 복선으로 심는 것은 허용된다 — 이미 진술에 있는 정보이므로.

prologue:
  - 프롤로그 첫 문단.
  - 둘째 문단.

# 확보 단어 카드에 찍히는 출처와 설명.
# ★ source 는 실제 획득 경로와 일치해야 한다 ★
# 어긋나면 플레이어에게 그냥 버그로 읽힌다.

terms:
  - { word: 만년필,     source: 방 수색 · 시신 검사, note: 바닥에 떨어져 있었다. }
  - { word: 가명,       source: 서류 조사 · 장부 조사, note: 여러 기록에 반복 등장했다. }
  - { word: 채무 관계,  source: 서류 조사,           note: 금전 기록에 남아 있었다. }


# =====================================================================
#  제출 전 자가 점검
# =====================================================================
#  [ ] 기회가 성립하는 인물이 범인 한 명뿐인가
#  [ ] 동기가 있어 보이는 인물이 여럿인가 (레드 헤링)
#  [ ] 레드 헤링으로 의심 산 인물이 물증으로도 배제되는가
#  [ ] 범인의 salience 가 낮은가
#  [ ] 트릭 아키타입이 요구하는 부품이 다 있는가 (exit · 인상)
#  [ ] 모든 인상에 broken_by 가 있는가
#  [ ] 허점이 실제로 심긴 자리를 가리키는가
#  [ ] 핵심 사실의 획득 경로가 2개 이상인가
#  [ ] 1장이 조사 없이 확정 가능한가
#  [ ] 각 장이 그 시점 가용 정보로 확정 가능한가
#  [ ] 프롤로그에 새 정보가 없는가
#  [ ] 공란 라벨이 전부 고정 어휘인가
#
#  검증기가 이 중 대부분을 자동 검사한다.
#  통과 후 볼 것: **오라클 회차 + 여유 ≥ 1 ≤ 예산**
# =====================================================================

# ─────────────────────────────────────────────────────────────────────
#  평면도 — **반드시 있어야 한다** (검증기 §9-3j)
#
#  ⚠ 이 절이 **서식에 없었다** (2026-07-31에 추가). 그래서 이 파일을 베낀 사건이
#  평면도 없이 나갔고, 앱이 자기 하드코딩 도면(산장)으로 폴백해 **다른 사건에
#  「다인의 방」·「거실」이 떴다.** 사람이 베끼는 파일이 빠뜨린 것을 가르치고 있었다.
#
#  앱에서는 **조사 화면이 곧 도면**이다 — 좌표가 없는 장소에는 갈 수가 없다.
#
#  두 계약을 지킨다:
#   ① **봉투는 직사각형이고 방은 빈틈 없이 채운다.** 앱이 방의 테두리를 안 그리고
#      건물 외곽선을 직사각형 하나로만 그리기 때문이다(`App.jsx` §sWalls·§sPoche).
#      ㄱ자·중정은 지금 앱으로 못 만든다 — 빈 자리에 선이 없어 방이 허공으로 번진다.
#      검산: 아래는 400x420 = 168,000 = 84,000 + 84,000.
#   ② **현장에는 문이 있어야 한다**(§9-3b). 트릭이 창으로 빠져나간다고 말하면
#      **그 창이 현장 방의 변에 실재해야** 한다 — 좌표로 대조한다.
#
#  `fixture`·`autopsy` 조사는 `fixtures` 에 **같은 id 의 항목**이 있어야 하고
#  `target.kind` 를 `fixture` 로 둔다(§9-3c 와 그 거울상이 양방향으로 문다).
# ─────────────────────────────────────────────────────────────────────
floor_plan:
  view_box: { w: 1000, h: 625 }
  scale: { x: 96, len: 90, y: 585, label: 5m }

  buildings:
    - { id: b_main, x: 100, y: 100, w: 400, h: 420, poche: var(--fg-3) }

  rooms:
    # 현장. tint 는 상태 표시이지 강조가 아니다 (절대 규칙 §유용도 시각 구분)
    - { id: r_room, building: b_main, loc: room, x: 100, y: 100, w: 200, h: 420, label: 방, scene: true, tint: "rgba(235,87,87,.10)", primary: true }
    - { id: r_hall, building: b_main, loc: hall, x: 300, y: 100, w: 200, h: 420, label: 홀, primary: true }

  # 부지 밖. 알리바이가 걸리는 자리는 도면에 있어야 진술과 대조된다
  zones:
    - { id: z_away, loc: away, x: 640, y: 230, w: 210, h: 130, label: "자택 (현장 밖)", offsite: true, primary: true }

  doors:
    # 현장에 문이 없으면 아무도 드나들 수 없는 방이 된다 (§9-3b)
    - { id: d_room,  x1: 300, y1: 260, x2: 300, y2: 340, hinge: p2, swing: -1, label: 방문, lx: 340, ly: 300 }
    - { id: d_front, x1: 380, y1: 520, x2: 460, y2: 520, hinge: p2, swing: -1, ext: true, label: 정문, lx: 420, ly: 545 }

  # `a_window`(창가 조사)가 방을 겨눈다 — 그 창이 현장 방의 변에 실재해야 한다
