# ─────────────────────────────────────────────────────────────────────
#  보고서 — ★통째로 지어냄★ 원문에 공란도 장 구성도 없다
# ─────────────────────────────────────────────────────────────────────
chapters:
  - order: 1
    title: 빈 사옥의 발견
    opening: 먼저 그날 무엇이 있었는지를 적는다.
    requires_facts: [f_no_p2, f_no_p3, f_no_p4, f_no_p5]
    blanks:
      - { label: 시각, candidates: closed,     answer: t2 }
      - { label: 장소, candidates: closed,     answer: piano }
      - { label: 인물, candidates: closed,     answer: p2, particle: 이/가 }
      - { label: 도구, candidates: discovered, answer: 과도, particle: (으)로 }
    report:
      - ""
      - { blank: 0 }
      - ", "
      - { blank: 1 }
      - "에서 "
      - { blank: 2 }
      - " 피해자를 발견했다. 복부에 꽂힌 "
      - { blank: 3 }
      - " 인한 과다출혈이 사인이었다."
    epilogue_order: 1
    epilogue: 신년의 빈 사옥에서 한 사람이 죽었다.

  - order: 2
    title: 드나든 시각
    opening: 남은 것은 누가 어디에 있었는가다.
    requires_facts: [f_no_p4_ok, f_no_p5_ok]
    blanks:
      - { label: 인물, candidates: closed, answer: p4, particle: 과/와 }
      - { label: 인물, candidates: closed, answer: p5, particle: 은/는 }
      - { label: 장소, candidates: closed, answer: cvs, particle: (으)로 }
    report:
      - "네 시 정각, "
      - { blank: 0 }
      - " "
      - { blank: 1 }
      - " 함께 건물을 나섰다. 한 사람은 "
      - { blank: 2 }
      - " 향했고 왕복 사십 분이 걸린다."
    epilogue_order: 2
    epilogue: 드나든 시각이 둘을 지웠다.

  - order: 3
    title: 건반이 가리킨 것
    opening: 이제 이름을 적는다.
    requires_facts: [f_motive, f_opp, f_means]
    # ★검증기가 요구해서 늘렸다★ 인물 5 × 동기 4 = 20 이라 「찍기가 가능하다」로
    # 떨어졌다. 장소를 더해 5×4×7 = 140. 원문에 없던 요구다
    blanks:
      - { label: 인물, candidates: closed,     answer: p1, is_accusation: true }
      - { label: 장소, candidates: closed,     answer: piano, particle: (으)로 }
      - { label: 동기, candidates: discovered, answer: 쌓인 반감 }
    report:
      - "모든 정황이 한 사람을 가리켰다. 진범은 "
      - { blank: 0 }
      - ". 그는 그 시각 "
      - { blank: 1 }
      - " 올라갔고, 그를 움직인 것은 "
      - { blank: 2 }
      - "."
    epilogue_order: 3
    epilogue: 건반 하나와 두 획이 이름을 적고 있었다.

reopen_per_chapter: 1

reveals:
  - trigger: { on: chapterComplete, chapter_order: 1 }
    yield: path
    actions: [a_cctv]
    surface: map
    narration: 그날의 정황이 정리됐다. 입구에 기록이 남아 있다는 것을 알게 됐다.

  # ★검증기가 요구해서 더했다★ 「뜨는 전환과 안 뜨는 전환이 갈리면 그게 유용도
  # 신호다」 — 전부 또는 전무. 원문에 인터루드라는 개념이 없다
  - trigger: { on: chapterComplete, chapter_order: 2 }
    yield: flavor
    surface: statement
    narration: 드나든 시각이 정리됐다. 남은 것은 건반 위의 표시다.

prologue:
  - 신년이었다. 사옥은 비어 있었고, 입구를 뺀 카메라는 전부 꺼져 있었다. 연말 정산이 끝나면 늘 그렇게 두는 건물이었다.
  - 1층 안무 연습실에 세 사람이 모였다. 스무 살이 된 해의 첫날을 그렇게 보내기로 한 것이었고, 회사에 아무도 없는 날은 흔치 않았다.
  - 둘은 각자의 층으로 올라갔다. 한 사람은 방음이 된 2층 보컬실로, 한 사람은 3층 녹음실의 피아노 앞으로.
  - 술과 안주가 떨어져 한 사람은 편의점으로, 한 사람은 치킨집으로 나갔다. 그리고 다섯 시가 되기 전에 위층에서 비명이 났다.

terms:
  - { word: 과도,      source: 시신 검사 · 소파 주변 수색, note: 복부에 꽂힌 채였다. }
  - { word: 쌓인 반감, source: 연습실 수색 · 통화내역 조회, note: 접힌 종이와 대화에 남아 있었다. }

# =====================================================================
#  평면도 — ★지어냄★ (2026-07-31 신설)
#
#  원문에는 도면이 없다. 그런데 **앱에서는 조사 화면이 곧 도면**이라 좌표가 없으면
#  그 장소에 갈 수가 없다. 이 파일이 그걸 빠뜨린 채 배포됐고, 앱이 자기 하드코딩
#  도면(산장)으로 폴백해서 **연습실 사건에 「다인의 방」·「거실」·「부엌」이 떴다.**
#  검증기 §9-3j 를 세워 다시는 없는 채로 못 나가게 했다.
#
#  ⚠ **층은 평면에 눕힌다.** 원문은 1·2·3층인데 앱의 도면은 평면 하나다(층 개념이
#  없다). 산장도 같은 방식이다. 방 이름에 층이 적혀 있으므로 정보는 안 잃는다.
#
#  ⚠ **봉투는 직사각형이고 방은 빈틈 없이 채운다** — 앱이 방의 테두리를 안 그리고
#  건물 외곽선을 직사각형 하나로만 그리기 때문이다(`App.jsx` §sWalls·§sPoche).
#  검산: 420x500 = 210,000 = 방 넷의 합(84,000 + 37,500 + 25,500 + 63,000).
# =====================================================================
floor_plan:
  view_box: { w: 1000, h: 625 }
  scale: { x: 96, len: 90, y: 585, label: 5m }

  buildings:
    - { id: hq, x: 80, y: 60, w: 420, h: 500, poche: var(--fg-3) }

  rooms:
    # 현장. 옅은 붉은 기는 상태 표시이지 강조가 아니다 (절대 규칙 §유용도 시각 구분)
    - { id: pianoR, building: hq, loc: piano, x: 80,  y: 60,  w: 420, h: 200, label: 3층 피아노 녹음실, scene: true, tint: "rgba(235,87,87,.10)", primary: true }
    - { id: vocalR, building: hq, loc: vocal, x: 80,  y: 260, w: 250, h: 150, label: 2층 보컬실, primary: true }
    - { id: wcR,    building: hq, loc: wc,    x: 330, y: 260, w: 170, h: 150, label: 1층 화장실 }
    - { id: danceR, building: hq, loc: dance, x: 80,  y: 410, w: 420, h: 150, label: 1층 안무 연습실, primary: true }

  # 사옥 밖. 알리바이가 걸린 자리들이라 도면에 있어야 진술과 대조된다
  zones:
    - { id: cvsZ,     loc: cvs,     x: 640, y: 80,  w: 210, h: 110, label: "편의점 (사옥 밖)",  offsite: true, primary: true }
    - { id: chickenZ, loc: chicken, x: 640, y: 230, w: 210, h: 110, label: "치킨집 (사옥 밖)", offsite: true, primary: true }
    - { id: dormZ,    loc: dorm,    x: 640, y: 380, w: 210, h: 110, label: "숙소 (사옥 밖)",   offsite: true, primary: true }

  doors:
    # 현장에 문이 없으면 아무도 드나들 수 없는 방이 된다 (검증기 §9-3b)
    - { id: pianodoor, x1: 180, y1: 260, x2: 260, y2: 260, hinge: p2, swing: -1, label: 녹음실 문, lx: 220, ly: 250 }
    - { id: vocaldoor, x1: 150, y1: 410, x2: 230, y2: 410, hinge: p1, swing: -1 }
    - { id: wcdoor,    x1: 380, y1: 410, x2: 440, y2: 410, open: true }
    - { id: front,     x1: 200, y1: 560, x2: 280, y2: 560, hinge: p2, swing: -1, ext: true, label: 정문, lx: 240, ly: 585 }

  # `a_win`(창가 조사)이 보컬실을 겨눈다 — 그 창이 도면에 실재해야 한다
  windows:
    - { x1: 80, y1: 300, x2: 80, y2: 380, label: 창문, lx: 66, ly: 340 }
    - { x1: 180, y1: 60, x2: 300, y2: 60, label: 창문, lx: 240, ly: 51 }

  # 눌러서 조사하는 고정물. **키가 곧 조사의 target.id 다** — 앱이 고정물 목록을
  # 여기서 만들기 때문에, 없으면 `fixture` 조사를 고를 수가 없다(검증기 §9-3c).
  #
  # ⚠ 이 사건은 조사가 target.kind: location 으로 장소 id 를 겨눈다. 그래서 키를
  # 장소 id 와 같게 둔다 — 좌표는 그 장소의 방 안에 찍는다.
  fixtures:
    piano: { x: 290, y: 150, label: 피아노,   loc: piano }
    dance: { x: 180, y: 485, label: 입구 카메라, loc: dance }
    vocal: { x: 120, y: 340, label: 창가,     loc: vocal }
    body:  { x: 200, y: 190, label: 시신,     loc: piano, body: true }
