    yield: path
    actions: [a_cctv]
    surface: map
    narration: 그날의 정황이 정리됐다. 입구에 기록이 남아 있다는 것을 알게 됐다.

  # ★검증기가 요구해서 더했다★ 「뜨는 전환과 안 뜨는 전환이 갈리면 그게 유용도
