chapters:
  - order: 1
    title: 빈 사옥의 발견
    opening: 먼저 그날 무엇이 있었는지를 적는다.
    requires_facts: [f_no_p2, f_no_p3, f_no_p4, f_no_p5]
    blanks:
      - { label: 시각, candidates: closed,     answer: t2 }
      - { label: 장소, candidates: closed,     answer: piano }
      - { label: 인물, candidates: closed,     answer: p2, particle: 이/가 }
      - { label: 도구, candidates: discovered, answer: 과도, particle: (으)로 }
    report:
      - ""
      - { blank: 0 }
      - ", "
      - { blank: 1 }
      - "에서 "
      - { blank: 2 }
      - " 피해자를 발견했다. 복부에 꽂힌 "
      - { blank: 3 }
      - " 인한 과다출혈이 사인이었다."
    epilogue_order: 1
    epilogue: 신년의 빈 사옥에서 한 사람이 죽었다.

  - order: 2
    title: 드나든 시각
    opening: 남은 것은 누가 어디에 있었는가다.
    requires_facts: [f_no_p4_ok, f_no_p5_ok]
    blanks:
      - { label: 인물, candidates: closed, answer: p4, particle: 과/와 }
      - { label: 인물, candidates: closed, answer: p5, particle: 은/는 }
      - { label: 장소, candidates: closed, answer: cvs, particle: (으)로 }
    report:
      - "네 시 정각, "
      - { blank: 0 }
      - " "
      - { blank: 1 }
      - " 함께 건물을 나섰다. 한 사람은 "
      - { blank: 2 }
      - " 향했고 왕복 사십 분이 걸린다."
    epilogue_order: 2
    epilogue: 드나든 시각이 둘을 지웠다.

  - order: 3
    title: 건반이 가리킨 것
    opening: 이제 이름을 적는다.
    requires_facts: [f_motive, f_opp, f_means]
    # ★검증기가 요구해서 늘렸다★ 인물 5 × 동기 4 = 20 이라 「찍기가 가능하다」로
    # 떨어졌다. 장소를 더해 5×4×7 = 140. 원문에 없던 요구다
    blanks:
      - { label: 인물, candidates: closed,     answer: p1, is_accusation: true }
      - { label: 장소, candidates: closed,     answer: piano, particle: (으)로 }
      - { label: 동기, candidates: discovered, answer: 쌓인 반감 }
    report:
      - "모든 정황이 한 사람을 가리켰다. 진범은 "
      - { blank: 0 }
      - ". 그는 그 시각 "
      - { blank: 1 }
      - " 올라갔고, 그를 움직인 것은 "
      - { blank: 2 }
      - "."
    epilogue_order: 3
    epilogue: 건반 하나와 두 획이 이름을 적고 있었다.

reopen_per_chapter: 1

reveals:
