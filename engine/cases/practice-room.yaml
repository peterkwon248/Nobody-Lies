# =====================================================================
#  ★ 결정 실험의 증거물 ★  (2026-07-31)
#
#  「사용자의 오프라인 크라임씬 텍스트도 캠페인이 되나」를 **의견 대신 재서** 답한 것.
#  원문(「연습실 살인사건」)을 손으로 이 스키마에 옮겼고 **검증을 통과한다.**
#
#  ── 이 파일이 증명하는 것 ──────────────────────────────────────────
#    첫 시도 오류 둘 → 고치니 통과. 그리고 **둘 다 게임화 층**이었다:
#      x 3장 조합 수 20 — 30 미만이면 찍기가 가능하다
#      x 2장 완성에는 서사가 없다
#    **논리 골격은 손도 안 대고 통과했다** — 유일성·기회·트릭 계약·획득 경로.
#
#    원문에서 온 것  64   격자 19칸 · 거짓말 4칸 · 진술 15문단 · 인물 6 · 범인 · 핵심물증
#    지어낸 것      112   조사 21 · 공란 10 · 레드헤링 20 · 예산·salience  ← 전부 게임화 층
#
#    그래서 들여오기는 **LLM 이 진실 세계만, 게임화는 코드**다 (`MANIFESTO.md` §5·§6).
#    아래에 원문에 없어서 지어내야 했던 자리마다 ★지어냄★ 을 달아뒀다 —
#    **그 표시가 곧 IMPORT-BRIEF 가 채워야 할 목록이다.**
#
#  ⚠ **말투 본보기가 아니다.** 진술을 원문 요약으로 썼기 때문에 `voice-check` 가
#     최장/최단 **1.29**(산장 2.46)로 낮게 나온다. 이 파일은 **논리 층 증거물**이다.
#     산문 기준선은 `mountain-lodge`·`closing-theater` 를 본다.
#
#  ⚠ **이름은 전부 바꿨다** — 원문은 실존 아이돌 이름을 쓰는데
#     `templates/case-template.yaml:90` 이 「실존 인물명을 쓰지 마라」고 못박는다.
#     ★ 그런데 **게이트에 그 검사가 없다** ★ UGC 가 상품이라 급소다.
# =====================================================================

id: practice-room
title: 연습실 살인사건
scale: campaign
budget: 7                      # ★지어냄★ 원문에 예산·조사 개념이 없다

incident:
  kind: homicide
  subject: v_mina
  description: 신년 휴일의 빈 사옥, 3층 피아노 녹음실에서 한 사람이 숨진 채 발견됐다
  scene: piano
  body_state: 복부에 과도가 꽂힌 채 피아노 의자에 기대어 있었다
  scene_state: 소지품은 소파에 가지런히 놓여 있었고 그 옆에서부터 핏자국이 이어졌다

prose:
  source: authored

# 원문: 과도가 복부에 꽂힌 채 발견 = 브리핑에서 무료로 보이는 것
seed_terms: [과도]

# ─────────────────────────────────────────────────────────────────────
#  시간 축 — 원문의 시각을 슬롯으로 잘랐다 ★일부 지어냄★
#  원문은 12시·2시·4시·4시50분·5시를 말한다. 격자 열로 만들려면 묶어야 한다
# ─────────────────────────────────────────────────────────────────────
slots:
  - { id: t0, label: 정오 무렵 }
  - { id: t1, label: 오후 }
  - { id: t2, label: 네 시 반 이후, window: true }   # 원문 사망추정시각 4시반~5시
  - { id: t3, label: 다섯 시 }

# ─────────────────────────────────────────────────────────────────────
#  장소 — 원문에 그대로 있다
# ─────────────────────────────────────────────────────────────────────
locations:
  - { id: piano,   label: 3층 피아노 녹음실, at_lodge: true }    # ← 현장
  - { id: vocal,   label: 2층 보컬실,        at_lodge: true }
  - { id: dance,   label: 1층 안무 연습실,   at_lodge: true }
  - { id: wc,      label: 1층 화장실,        at_lodge: true }
  - { id: cvs,     label: 편의점,            at_lodge: false }
  - { id: chicken, label: 치킨집,            at_lodge: false }
  - { id: dorm,    label: 숙소,              at_lodge: false }

# ─────────────────────────────────────────────────────────────────────
#  인물 — 원문의 5용의자. 진술·비밀은 원문에 있다. 이름만 바꿨다
# ─────────────────────────────────────────────────────────────────────
people:
  # 원문 「채영」 = 범인
  - id: p1
    name: 서채린
    age: 20
    job: 같은 그룹 멤버
    hidden_role: ringleader
    presence:
      - { slot: t0, at: dance }
      - { slot: t1, at: dance }
      - { slot: t2, at: piano }   # ← 범행
      - { slot: t3, at: wc }
    claim:
      - { slot: t0, at: dance }
      - { slot: t1, at: dance }
      - { slot: t2, at: dance }   # ← 이 사건의 유일한 거짓말 (취해서 잠들었다)
      - { slot: t3, at: wc }
    statement:
      voice: 감정이 앞서고 말끝이 흐려진다. 「…죠」로 자주 맺는다
      paragraphs:
        - 스무 살 되고 처음 맞는 신년이었어요. 회사에 아무도 없는 날이 이렇게 흔치 않은데, 다들 각자 스케줄이라 겨우 맞춘 날이었거든요. 즈안이랑 리솔이한테 제가 먼저 연락했어요.
        - 언니가 중간에 올라왔다 갔어요. 너무 많이 마시지 말라고. 늘 그런 식이죠. 저도 이제 성인인데 아직 애 취급이고. 서운했던 건 맞아요. 그렇다고 뭘 어쩌겠어요.
        - 저는 술이 약해서 금방 잠들었어요. 연습실 바닥에서요. 깨워서 일어났을 땐 다들 위층으로 뛰어가고 있었고. 그 사이 일은 하나도 기억이 안 나요. 왜 하필 그날은 그렇게 깊이 잤을까요?
        - 소지품은… 그건 좀 안 봐주시면 안 될까요. 이번 일이랑은 상관없는 거예요.
      gesture:
        pre: 손끝으로 소매를 계속 만진다
        post: 말끝을 흐리고 시선을 내린다
  # 원문 「사나」 = 2층 방음 보컬실, 최초 발견자
  - id: p2
    name: 문사희
    age: 23
    job: 같은 그룹 멤버
    hidden_role: unaware
    presence:
      - { slot: t1, at: vocal }
      - { slot: t2, at: vocal }
      - { slot: t3, at: piano }
    statement:
      voice: 차분하고 문장이 길다. 「…습니다」와 「…요」를 섞는다
      paragraphs:
        - 두 시쯤 언니랑 같이 3층에서 내려왔습니다. 언니는 피아노를 더 치겠다고 남았고, 저는 2층 보컬실로 갔어요. 새 곡 가이드를 그날까지 넘겨야 해서, 명절이고 뭐고 없었습니다.
        - 그 방은 안팎으로 방음입니다. 문을 닫으면 복도 발소리도 안 들려요. 휴대폰은 숙소에 두고 나왔고요. 그게 계속 마음에 걸립니다. 그 방에서 무슨 소리든 들을 수 있었을까요?
        - 가이드를 다 넘기고 올라갔는데 문이 열려 있었습니다. 언니가 피아노 의자에 기대어 있었고, 복부에 과도 같은 것이 그대로 꽂혀 있었어요. 저는 그걸 뽑지도 못하고 소리만 질렀습니다.
        - 통화 목록 얘기는 하고 싶지 않습니다. 언니와는 상관없는 일이에요. 조금만 일찍 올라갔으면 달라졌을까요?
      gesture:
        pre: 두 손을 무릎 위에 포갠 채 움직이지 않는다
        post: 말을 마치고도 한참 앞을 본다
  # 원문 「나연」 = 4시 50분 입장
  - id: p3
    name: 한나경
    age: 24
    job: 같은 그룹 멤버
    hidden_role: unaware
    presence:
      - { slot: t0, at: dorm }
      - { slot: t1, at: dorm }
      - { slot: t2, at: dance }
      - { slot: t3, at: piano }
    statement:
      voice: 건조하고 짧게 끊는다. 전부 「…습니다」로 맺는다
      paragraphs:
        - 쉬는 날이라 숙소에 있었습니다. 언니한테서 사희 휴대폰 좀 가져다 달라고 연락이 왔습니다.
        - 사옥에 도착한 게 다섯 시가 다 되어서였습니다. 사희가 어느 층인지 몰라 1층부터 훑던 중에 위층에서 비명이 났습니다.
        - 가방에 있던 건 오래된 겁니다. 그 얘긴 넘어가 주셨으면 합니다. 조금만 일찍 왔으면 달랐을까요?
      gesture:
        pre: 팔짱을 낀 채 앉는다
        post: 더 묻기 전에 자리에서 일어선다
  # 원문 「쯔위」 = 편의점
  - id: p4
    name: 위즈안
    age: 20
    job: 같은 그룹 멤버
    hidden_role: unaware
    presence:
      - { slot: t0, at: dance }
      - { slot: t1, at: dance }
      - { slot: t2, at: cvs }
      - { slot: t3, at: piano }
    statement:
      voice: 말이 많고 「…구요」·「…네요」가 잦다
      paragraphs:
        - 채린이가 모이자고 해서 나갔어요. 신년인데 뭐라도 하자고 하길래요. 언니가 중간에 올라와서 적당히 마시라고 한마디 하고 갔구요. 저희끼리는 늘 있는 일이라 대수롭지 않았어요.
        - 채린이는 술이 약해서 일찍 잠들었어요. 네 시쯤 술이랑 안주가 떨어져서 제가 사러 나갔습니다. 편의점이 왕복 사십 분이라 그 시간이 꼬박 걸렸네요. 왜 하필 그날 제가 나갔을까요?
        - 돌아왔더니 채린이가 안 보여서 찾고 있었어요. 그러다 위층에서 비명이 나서 올라갔는데, 언니 배에 과도가 꽂혀 있었구요. 제가 나가 있던 그 사이에 뭐가 있었던 걸까요?
        - 영수증은 그냥 제 개인적인 거예요.
      gesture:
        pre: 말하면서 손을 자주 움직인다
        post: 숨을 크게 내쉰다
  # 원문 「예리」 = 치킨집
  - id: p5
    name: 예리솔
    age: 20
    job: 다른 그룹 멤버
    hidden_role: unaware
    presence:
      - { slot: t0, at: dance }
      - { slot: t1, at: dance }
      - { slot: t2, at: chicken }
      - { slot: t3, at: dance }
    statement:
      voice: 겉돌고 문장을 짧게 끊는다. 가끔 평서로 맺는다
      paragraphs:
        - 채린이가 부르길래 왔어요. 저는 그 그룹도 아닌데. 이 그룹 언니라는 분이 와서 괜히 한 소리 하고 가서 기분이 좀 그랬고요.
        - 즈안이랑 같이 나갔다가 저만 되돌아왔어요. 지갑을 두고 나왔거든요. 그러다 갑자기 치킨이 당겨서. 치킨집은 반대 방향으로 이십 분이에요.
        - 나가기 전에 보니 채린이는 자고 있었다. 저는 원래 남의 회사 건물에 오래 못 있어요. 제가 거기 왜 갔을까요?
        - 사진은 물어보지 말아 주세요.
      gesture:
        pre: 의자 끝에 걸터앉는다
        post: 묻지 않은 것까지 덧붙이다 만다
victim: v_mina
victim_profile:
  name: 도미나
  age: 22
  job: 같은 그룹 멤버

culprit: p1

# ─────────────────────────────────────────────────────────────────────
#  트릭 — 원문에서 유추했다 ★일부 지어냄★
#  원문에 「트릭 아키타입」 개념이 없다. 「잠들어 있었다고 주장」 = alibi_fabrication
# ─────────────────────────────────────────────────────────────────────
trick:
  types: [alibi_fabrication]
  props: [e_knife]
  staging: []
  illusions:
    - id: il_asleep
      kind: absence
      impression: 범인은 그 시각 1층에서 잠들어 있었다
      made_by: []
      broken_by: [e_keys, e_cctv]
  flaw:
    text: 잠들어 있었다면 어떻게 1층 화장실에서 발견됐는가
    planted_in: [p1]

# ─────────────────────────────────────────────────────────────────────
#  물증 — 원문에 있는 것 + 게임화에 필요해서 지어낸 것
# ─────────────────────────────────────────────────────────────────────
evidence:
  - id: e_knife
    description: 과도
    found_at: 피해자의 복부
    record: 손잡이까지 밀려 들어가 있었다.
    yields_terms: [과도]
    at_scene: true

  - id: e_trail
    description: 이어진 핏자국
    record: 소파 옆에서부터 피아노까지 자국이 이어졌다.
    yields_terms: [과도]

  # ★원문의 핵심 단서★ 피아노 건반의 핏자국(도=C)과 그 옆의 >- (=Y) → CY
  - id: e_keys
    description: 건반 위의 표시
    found_at: 3층 피아노
    record: 한 건반에 붉은 점이 찍혀 있었고 그 옆에 두 획이 그어져 있었다.

  - id: e_cctv
    description: 입구 기록
    record: 네 시 정각에 둘이 나갔고 네 시 십분에 하나가 들어왔다가 십삼분에 다시 나갔다. 네 시 오십분에 하나가 들어왔다.

  - id: e_mutual
    description: 두 사람의 왕복 시간
    record: 한쪽은 왕복 사십 분, 다른 쪽은 편도 이십 분 거리라고 말했다.

  - id: e_memo
    description: 접힌 메모
    record: 같은 이름이 여러 번 적혀 있었다. 뒷장에는 지운 자국 위에 다시 쓴 문장이 몇 줄 남았다.
    yields_terms: [쌓인 반감]

  - id: e_chat
    description: 남아 있던 대화
    record: 주고받은 말이 두 달치 남아 있었다. 뒤로 갈수록 답이 짧아졌고, 마지막 며칠은 한쪽만 말했다.
    yields_terms: [쌓인 반감]

  - id: e_herring1
    description: 지워진 통화 목록
  - id: e_herring2
    description: 오래된 편지
  - id: e_herring3
    description: 접힌 영수증
  - id: e_herring4
    description: 낡은 사진
  - id: e_herring5
    description: 빈 약통

# ─────────────────────────────────────────────────────────────────────
#  사실
# ─────────────────────────────────────────────────────────────────────
facts:
  - { id: f_opp, kind: opportunity, subject: p1,
      content: 사망 구간에 3층에 있었다, revealed_by: [e_keys, e_cctv] }

  - { id: f_no_p2, kind: no_opportunity, subject: p2, content: 2층 방음실에 있었다, revealed_by: [] }
  - { id: f_no_p3, kind: no_opportunity, subject: p3, content: 사옥 밖에 있었다,   revealed_by: [] }
  - { id: f_no_p4, kind: no_opportunity, subject: p4, content: 사옥 밖에 있었다,   revealed_by: [] }
  - { id: f_no_p5, kind: no_opportunity, subject: p5, content: 사옥 밖에 있었다,   revealed_by: [] }

  - { id: f_no_p2_ok, kind: no_opportunity, subject: p2, content: 왕복 시간이 맞물린다, revealed_by: [e_mutual] }
  - { id: f_no_p3_ok, kind: no_opportunity, subject: p3, content: 왕복 시간이 맞물린다, revealed_by: [e_mutual] }
  - { id: f_no_p4_ok, kind: no_opportunity, subject: p4, content: 왕복 시간이 맞물린다, revealed_by: [e_mutual] }
  - { id: f_no_p5_ok, kind: no_opportunity, subject: p5, content: 왕복 시간이 맞물린다, revealed_by: [e_mutual] }

  - { id: f_means,  kind: means,  subject: p1, content: 과도를 쥘 수 있었다, revealed_by: [e_knife, e_trail] }
  - { id: f_motive, kind: motive, subject: p1, content: 쌓인 반감,          revealed_by: [e_memo, e_chat] }

  - { id: f_h1, kind: context, subject: p2, content: 감추는 것이 있다, revealed_by: [e_herring1] }
  - { id: f_h2, kind: context, subject: p3, content: 감추는 것이 있다, revealed_by: [e_herring2] }
  - { id: f_h3, kind: context, subject: p4, content: 감추는 것이 있다, revealed_by: [e_herring3] }
  - { id: f_h4, kind: context, subject: p5, content: 감추는 것이 있다, revealed_by: [e_herring4] }
  - { id: f_h5, kind: context, subject: p1, content: 감추는 것이 있다, revealed_by: [e_herring5] }

# ─────────────────────────────────────────────────────────────────────
#  조사 — ★통째로 지어냄★ 원문에 「조사」라는 개념 자체가 없다
#  크라임씬은 토론으로 좁히는 게임이라 예산·탐색 공간이 없다
# ─────────────────────────────────────────────────────────────────────
actions:
