    source: 특별 전시실 수색 · 시신 검사
    note: 바닥에 떨어져 있었다.
  - word: 한재민
    source: 서류 조사 · 장부 조사
    note: 여러 기록에 반복 등장했다.
  - word: 예산 갈등
    source: 서류 조사
    note: 금전 기록에 남아 있었다.
  - word: 야간 순찰 일지
    source: 야간 순찰 일지 확인
    note: 야간 순찰 시간으로 적힌 줄이 남아 있었다.
  - word: 반출 신청서
    source: 반출 신청서 확인
    note: 중앙 로비가 적힌 줄이 남아 있었다.
  - word: 보안 카드 기록
    source: 보안 카드 기록 확인
    note: 야간 순찰 시간으로 적힌 줄이 남아 있었다.
