prologue:
  - 시립 자연사 박물관. 오서윤은 그곳에서 지내고 있었다.
  - 그곳에는 다섯 사람이 더 머물고 있었다. 폐관 준비, 중앙 로비에는 불이 켜져 있었다.
  - 다음 날 개관 직전, 가장 먼저 일어난 사람이 특별 전시실 문을 열었다.
  - 오서윤은 이미 숨을 쉬지 않았다.
terms:
