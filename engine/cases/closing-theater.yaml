  - id: e_tool
    description: 청테이프
    found_at: 분장실
    record: 분장실 바닥 구석에서 나온 청테이프 뭉치. 끝이 손으로 뜯겨 있었고 안쪽 면에 먼지가 붙어 있었다.
    yields_terms:
