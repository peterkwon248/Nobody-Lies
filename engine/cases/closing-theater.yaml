  - id: e_toolmark
    description: 도구가 남긴 자국
    record: 임소현의 목덜미와 손목 안쪽에 남은 폭이 일정한 자국. 위에 끈적한 것이 얇게 묻어 있었다.
    yields_terms:
      - 청테이프
  - id: e_alias
    description: '''윤다래'' 라는 이름의 기록'
    record: 폐관 서류 묶음에서 나온 한 장. 윤다래라는 이름이 적혀 있었고 서명란 필체가 다른 서류와 달랐다.
    yields_terms:
      - 윤다래
  - id: e_alias2
    description: '''윤다래'' 가 적힌 두 번째 기록'
    record: 장부 뒷장에 적힌 이름. 정산과 별개로 오간 돈을 받는 쪽이 윤다래로 되어 있었다.
    yields_terms:
      - 윤다래
  - id: e_motive
    description: 금전 기록
    record: 정산 밖에서 오간 돈이 적힌 몇 줄. 마지막 줄은 폐관 발표가 있던 달에서 끊겨 있었다.
    yields_terms:
      - 퍼진 소문
  - id: e_mutual
    description: 넷의 상호 보증
    record: 로비에 남아 있던 넷이 서로에 대해 말한 내용. 서로 어긋나지 않았고 본 범위는 로비 안이었다.
  - id: e_herring1
    description: 개인적인 편지
    record: 하경석의 수첩에 끼워져 있던 부치지 않은 편지. 가족에게 쓴 것이었다.
  - id: e_herring2
    description: 오래된 사진
    record: 문선호의 지갑에서 나온 오래된 사진. 뒷면 글씨가 지워져 있었다.
  - id: e_herring3
    description: 접힌 영수증
    record: 조태식의 주머니에서 나온 접힌 영수증. 값이 적지 않은 장비를 지난해에 산 것이었다.
  - id: e_herring4
    description: 지워진 기록
    record: 표미숙의 가방 바닥에 있던 이력서 사본. 학력란 한 줄이 지워지고 다시 적혀 있었다.
  - id: e_herring5
    description: 낡은 명함
    record: 서준기의 공구 주머니에서 나온 낡은 명함. 다른 곳의 이름이 찍혀 있었다.
  - id: e_seal
    description: 안쪽에서 걸린 잠금
    record: 분장실 문의 걸쇠가 안쪽에서 내려와 있던 상태. 부서진 데는 없었고 축 주변에 마른 자국이 있었다.
    is_staging: true
  - id: e_gap
    description: 문틀의 틈
    record: 문과 틀 사이의 틈. 안쪽 페인트가 한 뼘 길이로 한쪽 방향으로 벗겨져 있었다.
  - id: e_rec1
    description: 근무 교대표
    record: 그날 밤 남기로 돼 있던 사람과 실제로 남은 사람이 적힌 표. 한 칸이 고쳐 쓰여 있었다. 고쳐 쓴 칸은 밤 열 시부터 열한 시 사이였다.
    yields_terms:
      - 근무 교대표
  - id: e_rec2
    description: 열쇠 반납 장부
    # ★2026-08-05★ 문안이 **아무 곳도 안 가리키고 있었다.** 3장 서술문은
    # 「…남아 있었고, [로비]를 가리켰다」고 묻는데 기록에 장소가 한 번도 없었다.
    # points_at 도 비어 있어 솔버가 undecidable → 교차표에서 통째로 빠져 있었다.
    # 생성기의 새 문안 꼴(`적힌 자리는 {장소}.`)에 맞췄다 — 그쪽이 정본이다
    record: 빌려간 열쇠와 돌려준 시각이 적힌 장부. 그날 밤 한 줄은 반납란이 비어 있었다. 적힌 자리는 로비.
    points_at: { location: hall }
    yields_terms:
      - 열쇠 반납 장부
  - id: e_rec3
    description: 당일 입장권 내역
    record: 그날 판매된 표의 수와 회차가 적힌 내역. 몇 장은 판매 시각이 공연 시작 뒤로 찍혀 있었다. 마지막 취소 처리는 밤 열 시부터 열한 시 사이에 찍혀 있었다.
    yields_terms:
      - 당일 입장권 내역
