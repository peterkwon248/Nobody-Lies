seed_terms:
  - 청테이프
prologue:
  - 폐관까지 두 주가 남은 극장이었다. 마지막 공연이 끝나고 관객이 빠져나간 뒤에도 다섯 사람은 건물 안에 남아 있었다.
  - 다음 날 아침, 분장실에서 임소현이 발견됐다. 서른, 이 극장의 지배인이었다.
  - 로비의 불은 밤새 켜져 있었고, 앞문은 잠겨 있었다. 뒷마당으로 나가는 문만 여닫힌 자국이 있었다.
  - 다섯 사람은 모두 그날 밤 극장에 있었다고 말했다. 조사는 그 말들에서 시작됐다.
terms:
  - word: 청테이프
    source: 분장실 수색 · 시신 검사
    note: 극장에서 흔히 쓰는 회색 접착 테이프. 분장실 바닥 구석에서 뭉치가 나왔다.
  - word: 윤다래
    source: 서류 조사 · 장부 조사
    note: 폐관 서류 한 장과 장부 뒷장에 적혀 있던 이름.
  - word: 퍼진 소문
    source: 서류 조사
    note: 정산 밖에서 오간 돈을 두고 극장 안에서 돌던 이야기.
  - word: 근무 교대표
    source: 근무 교대표 확인
    note: 그날 밤 남기로 돼 있던 사람과 실제로 남은 사람을 적어둔 표.
  - word: 열쇠 반납 장부
    source: 열쇠 반납 장부 확인
    note: 빌려간 열쇠와 돌려준 시각을 짝지어 적는 장부.
  - word: 당일 입장권 내역
    source: 당일 입장권 내역 확인
    note: 그날 판매된 표의 수와 회차, 취소 처리가 남은 기록.
