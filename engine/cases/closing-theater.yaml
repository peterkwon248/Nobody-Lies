actions:
  - id: a_room
    label: 분장실 수색
    verb: search
    cost: 1
    gives:
      - e_tool
    salience: 0.5
    yield: solution
    target:
      kind: location
      id: room
    result:
      title: 분장실 안쪽
      body: >-
        화장대 전등이 켜진 채였고 의자 하나가 벽 쪽으로 밀려 있었다. 바닥 구석에서 청테이프 뭉치가 나왔다. 끝이 손으로 뜯긴 자리였고 안쪽 면에 먼지가 붙어 있었다. 거울 앞 선반은
        물건이 놓였던 자국만 남아 있었다.
  - id: a_body
    label: 시신 검사
    verb: autopsy
    cost: 1
    gives:
      - e_toolmark
    salience: 0.6
    yield: solution
    target:
      kind: fixture
      id: body
    result:
      title: 임소현의 상태
      body: >-
        외상은 크지 않았다. 목덜미와 손목 안쪽에 가늘고 곧은 자국이 남아 있었고, 폭이 일정했다. 자국 위로 끈적한 것이 얇게 묻어 있었다. 옷매무새는 흐트러져 있었으나 신발은 벗겨지지
        않은 채였다.
  - id: a_papers
    label: 서류 조사
    verb: search
    cost: 1
    gives:
