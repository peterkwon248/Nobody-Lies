      body: 빌려간 열쇠와 돌려준 시각이 짝을 이루어 적혀 있었다. 그날 밤 것 중 한 줄은 반납란이 비어 있었다. 어느 문의 열쇠인지는 번호로만 적혀 있었고 번호표는 사무실 벽에 걸려 있었다.
  - id: a_rec3
    label: 당일 입장권 내역 확인
    verb: search
    cost: 1
    gives:
      - e_rec3
    salience: 0.32
    yield: solution
    target:
      kind: location
      id: away
    result:
      title: 당일 입장권 내역
      body: 판매된 표의 수와 회차가 적혀 있었다. 마지막 회차의 표 몇 장은 판매 시각이 공연 시작 뒤로 찍혀 있었다. 취소 처리된 줄도 있었고 그 옆에 손글씨로 짧은 표시가 되어 있었다.
