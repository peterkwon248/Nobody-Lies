    salience: 0.65
    yield: redherring
    target:
      kind: person
      id: p5
    result:
      title: 낡은 명함
      body: >-
        공구 주머니와 마른 걸레, 필터 몇 장이 나왔다. 주머니 안쪽에서 낡은 명함이 한 장 나왔다. 이 극장이 아닌 다른 곳의 이름이 찍혀 있었고 모서리가 닳아 있었다. 뒷면에는 아무것도
        적혀 있지 않았다.
  - id: a_alibi
    label: 알리바이 대조 · 하경석 ↔ 문선호
    verb: alibi
    cost: 1
    gives:
      - e_mutual
    salience: 0.45
    yield: exclusion
    pair:
      - p1
      - p2
    result:
      title: 하경석과 문선호의 진술 대조
      body: >-
        두 사람의 말은 서로 어긋나지 않았다. 로비에 남아 있던 사람들이 서로에 대해 말한 내용도 같은 방향이었고, 넷의 말이 서로를 받치고 있었다. 다만 각자가 본 것은 로비 안에 한정돼
        있었다.
  - id: a_lock
    label: 잠금장치 조사
    verb: fixture
    cost: 1
    gives:
      - e_seal
    salience: 0.5
    yield: solution
    target:
      kind: fixture
      id: room
    result:
      title: 분장실 잠금장치
      body: 문은 안쪽에서 걸린 상태였다. 걸쇠는 제자리에 내려와 있었고 부서진 데는 없었다. 걸쇠 축 주변에 마른 자국이 얇게 남아 있었다. 열쇠 구멍 쪽에는 긁힌 자리가 없었다.
  - id: a_frame
    label: 문틀 조사
    verb: search
    cost: 1
    gives:
      - e_gap
    salience: 0.25
    yield: solution
    target:
      kind: location
      id: loc2
    result:
      title: 문틀
      body: >-
        문과 틀 사이에 손가락이 들어갈 만한 틈이 있었다. 오래된 건물이라 틀이 아래쪽으로 내려앉아 있었다. 틈 안쪽 페인트가 한 뼘 길이로 벗겨져 있었고 벗겨진 방향이 한쪽으로 쏠려
        있었다.
  - id: a_rec1
    label: 근무 교대표 확인
    verb: search
    cost: 1
    gives:
      - e_rec1
    salience: 0.32
    yield: solution
    target:
      kind: location
      id: loc3
    result:
      title: 근무 교대표
      body: 그날 밤 남기로 돼 있던 사람과 실제로 남은 사람이 적혀 있었다. 마지막 공연 뒤의 칸은 손으로 고쳐 쓴 자리가 있었다. 고친 글씨와 원래 글씨는 같은 펜이었다.
  - id: a_rec2
    label: 열쇠 반납 장부 확인
    verb: search
    cost: 1
    gives:
      - e_rec2
    salience: 0.32
    yield: solution
    target:
      kind: location
      id: approach
    result:
