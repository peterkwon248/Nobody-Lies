chapters:
  - order: 1
    title: 발견
    opening: 먼저 그 자리에 무엇이 있었는지를 적는다.
    requires_facts:
      - f_no_p1
      - f_no_p2
      - f_no_p3
      - f_no_p5
    blanks:
      # asks — 이 사건은 생성기를 거쳤다. 생성기가 만드는 순간 알고 있던 물음을
      # 그대로 복원한 것이지 추정이 아니다(`generate.ts` 세 자리). 서술문이 받친다:
      # *"소지품에서 개인적인 편지가 나온 것은 [인물]"* — 식별 고리가 산문에 살아 있다.
      - label: 인물
        candidates: closed
        answer: p1
        asks: { kind: belongingsOwner, item: 개인적인 편지 }
      - label: 장소
        candidates: closed
        answer: room
        asks: { kind: scene }
      - label: 시각
        candidates: closed
        answer: t2
        asks: { kind: discoveryTime }
      - label: 도구
        candidates: discovered
        answer: 청테이프
        particle: 이/가
        asks: { kind: murderWeapon, evidence: e_tool }
    report:
      - blank: 2
      - ', '
      - blank: 1
      - '에서 '
      - blank: 3
      - ' 발견됐다. 소지품에서 개인적인 편지가 나온 것은 '
      - blank: 0
      - '.'
    epilogue_order: 1
  - order: 2
    title: 근무 교대표
    opening: 다음으로 기록에 남은 것을 적는다.
    requires_facts:
      - f_rec1
    blanks:
      - label: 인물
        candidates: closed
        answer: p1
        asks: { kind: belongingsOwner, item: 개인적인 편지 }
      - label: 물품
        candidates: discovered
        answer: 근무 교대표
        particle: 이/가
        asks: { kind: strandTerm, evidence: e_rec1 }
      # 「…가리켰다」의 대상. t1 이 사망 구간 칸이다 (슬롯 t0 · t1* · t2)
      - label: 시각
        candidates: closed
        answer: t1
        particle: 을/를
        asks: { kind: murderCell }
    report:
      - '기록이 남아 있던 자리의 주인은 소지품에서 개인적인 편지가 나온 '
      - blank: 0
      - '. '
      - blank: 1
      - ' 남아 있었고, '
      - blank: 2
      - ' 가리켰다.'
    epilogue_order: 2
  - order: 3
    title: 열쇠 반납 장부
    opening: 다음으로 기록에 남은 것을 적는다.
    requires_facts:
      - f_rec2
    blanks:
      - label: 인물
        candidates: closed
        answer: p2
        asks: { kind: belongingsOwner, item: 오래된 사진 }
      - label: 접촉수단
        candidates: discovered
        answer: 열쇠 반납 장부
        particle: 이/가
        asks: { kind: strandTerm, evidence: e_rec2 }
      # 「…가리켰다」의 대상이 장소인 판본. 그 기록이 가리키는 곳 = Evidence.pointsAt
      - label: 장소
        candidates: closed
        answer: hall
        particle: 을/를
        asks: { kind: recordPlace, evidence: e_rec2 }
    report:
      - '기록이 남아 있던 자리의 주인은 소지품에서 오래된 사진가 나온 '
      - blank: 0
      - '. '
      - blank: 1
      - ' 남아 있었고, '
      - blank: 2
      - ' 가리켰다.'
    epilogue_order: 3
  - order: 4
    title: 당일 입장권 내역
    opening: 다음으로 기록에 남은 것을 적는다.
    requires_facts:
      - f_rec3
    blanks:
      - label: 인물
        candidates: closed
        answer: p3
        asks: { kind: belongingsOwner, item: 접힌 영수증 }
      - label: 은닉처
        candidates: discovered
        answer: 당일 입장권 내역
        particle: 이/가
        asks: { kind: strandTerm, evidence: e_rec3 }
      - label: 시각
        candidates: closed
        answer: t1
        particle: 을/를
        asks: { kind: murderCell }
    report:
      - '기록이 남아 있던 자리의 주인은 소지품에서 접힌 영수증가 나온 '
      - blank: 0
      - '. '
      - blank: 1
      - ' 남아 있었고, '
      - blank: 2
      - ' 가리켰다.'
    epilogue_order: 4
  - order: 5
    title: 이름과 이유
    opening: 남은 것은 이름과 이유다.
    requires_facts:
      - f_motive
      - f_opp
      - f_means
    blanks:
      - label: 인물
        candidates: closed
        answer: p4
        is_accusation: true
        asks: { kind: culprit }
      - label: 정체
        candidates: discovered
        answer: 윤다래
        asks: { kind: culpritAlias, evidence: e_alias }
      - label: 동기
        candidates: discovered
        answer: 퍼진 소문
        asks: { kind: culpritMotive, evidence: e_motive }
    report:
      - '모든 정황이 한 사람을 가리켰다. 진범은 '
      - blank: 0
      - '. 기록에 남은 이름은 '
      - blank: 1
      - ', 그리고 그를 움직인 것은 '
      - blank: 2
      - .
    epilogue_order: 5
reveals:
  - trigger:
      'on': chapterComplete
      chapter_order: 1
    yield: path
    surface: map
    actions:
      - a_ledger
    narration: >-
      자정을 조금 넘긴 무렵의 정황이 한 줄로 정리됐다. 로비의 불이 언제 꺼졌는지, 앞문이 언제 잠겼는지가 시간 위에 놓였다. 정리가 끝날 때쯤 사무실 캐비닛에 묶여 있던 종이 뭉치 이야기가
      나왔다. 극장이 문을 닫기로 한 뒤로 아무도 손대지 않은 것들이었다.
  - trigger:
      'on': chapterComplete
      chapter_order: 2
    yield: flavor
    surface: statement
    add_claims:
      - speaker: p5
        content: >-
          밤 열 시부터 열한 시 사이에 무대에 있었던 건 스크린 밑단 때문이었습니다. 그거 안 눌러놓으면 다음 상영 때 화면 아래가 접힙니다. 제 일이라 갔던 거고, 그 밖에 보탤 건
          없습니다.
        target: statement
    narration: 종이를 넘기는 소리가 멎고 한동안 아무도 말을 하지 않았다. 서준기가 의자를 조금 당겨 앉더니 묻지 않은 것을 먼저 꺼냈다.
  - trigger:
      'on': chapterComplete
      chapter_order: 3
    yield: flavor
    surface: statement
    add_claims:
      - speaker: p4
        content: 다시 여쭈시니 말씀드리면, 밤 열 시부터 열한 시 사이에 제가 있던 곳은 로비예요. 저는 이십 년을 그 매표구 앞에서 보냈어요. 그 시간에 제가 다른 데 가 있을 이유가 없죠.
        target: statement
    narration: 정리가 끝나고 종이가 다시 제자리로 돌아갔다. 표미숙이 식은 잔을 두 손으로 감싸 쥔 채 앉아 있다가 입을 열었다.
  - trigger:
      'on': chapterComplete
      chapter_order: 4
    yield: flavor
    surface: statement
    add_claims:
      - speaker: p3
        content: 영사실에 있던 시간에 대해서는 앞서 말씀드린 그대로입니다. 두고 온 걸 가지러 갔고, 찾아서 들고 나왔어요. 더 보태면 없는 말을 지어내는 게 되니까 그만하겠습니다.
        target: statement
    narration: 확인이 끝나자 조태식이 무릎에 올려둔 옷가지를 옆으로 밀어놓았다. 몇 번 입을 열었다 다물더니 앞서 한 말을 되짚었다.
reopen_per_chapter: 1
