      - e_motive
    salience: 0.3
    yield: solution
    target:
      kind: location
      id: hall
    result:
      title: 캐비닛의 서류
      body: >-
        폐관 절차를 위해 묶어둔 서류철이었다. 대부분은 계약서와 신고서 사본이었다. 그 사이에 끼어 있던 한 장에 윤다래라는 이름이 적혀 있었다. 서명란의 필체가 같은 묶음의 다른 서류와
        달랐다.
  - id: a_ledger
    label: 장부 조사
    verb: search
    cost: 1
    gives:
      - e_alias2
    salience: 0.3
    yield: solution
    target:
      kind: location
      id: loc1
    result:
      title: 장부의 뒷장
      body: >-
        매달 정산이 손글씨로 적혀 있었다. 뒷장에는 정산과 별개로 오간 돈이 몇 줄 남아 있었고, 받는 쪽 이름이 윤다래로 적혀 있었다. 극장 안에서 그 돈에 대해 이야기가 돌았다는 말은
        여러 사람에게서 나왔다. 마지막 줄은 폐관 발표가 있던 달에서 끊겨 있었다.
  - id: a_h1
    label: 소지품 검사 · 하경석
    verb: belongings
    cost: 1
    gives:
      - e_herring1
    salience: 0.85
    yield: redherring
    target:
      kind: person
      id: p1
    result:
      # 제목이 「X의 소지품」이면 다섯이 전부 같은 꼴이라 아무도 구별하지 않는다.
      # 물건 이름으로 바꾸면 소지품 검사가 사람을 1:1 로 짚는다(식별 고리 · proof.ts R1).
      title: 개인적인 편지
      body: >-
        수첩과 열쇠 꾸러미, 접힌 안경집이 나왔다. 수첩 뒤쪽에 부치지 않은 편지가 끼워져 있었다. 가족에게 쓴 것이었고 극장 일을 진작 그만둔 것처럼 적혀 있었다. 날짜는 적혀 있지
        않았다.
  - id: a_h2
    label: 소지품 검사 · 문선호
    verb: belongings
    cost: 1
    gives:
      - e_herring2
    salience: 0.8
    yield: redherring
    target:
      kind: person
      id: p2
    result:
      title: 오래된 사진
      body: >-
        담뱃갑과 손전등, 얇은 수건이 나왔다. 지갑 안쪽에서 오래된 사진 한 장이 나왔다. 무대 위에 선 젊은 사람이 찍혀 있었고 뒷면에 오디션 날짜로 보이는 글씨가 지워져 있었다. 사진
        모서리는 여러 번 접힌 자국이 있었다.
  - id: a_h3
    label: 소지품 검사 · 조태식
    verb: belongings
    cost: 1
    gives:
      - e_herring3
    salience: 0.75
    yield: redherring
    target:
      kind: person
      id: p3
    result:
      title: 접힌 영수증
      body: >-
        실패와 가위, 옷핀이 든 주머니가 나왔다. 그 안에 접힌 영수증이 하나 있었다. 값이 적지 않은 장비를 산 것이었고 결제일이 지난해였다. 포장을 뜯은 흔적에 대한 언급은 어디에도
        없었다.
  - id: a_h4
    label: 소지품 검사 · 표미숙
    verb: belongings
    cost: 1
    gives:
      - e_herring4
    salience: 0.7
    yield: redherring
    target:
      kind: person
      id: p4
    result:
      title: 지워진 기록
      body: 손거울과 잔돈 지갑, 여벌 스타킹이 나왔다. 가방 바닥에 이력서 사본이 접힌 채로 있었다. 학력란의 한 줄이 지워지고 그 위에 다시 적혀 있었다. 종이는 여러 해 지난 것이었다.
  - id: a_h5
    label: 소지품 검사 · 서준기
    verb: belongings
    cost: 1
    gives:
