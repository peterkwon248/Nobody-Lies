    label: 극장 뒷마당
    at_lodge: true
  - id: away
    label: 역 앞 큰길
    at_lodge: false
people:
  - id: p1
    name: 하경석
    age: 33
    job: 극장 지배인
    claim_summary: 밤 열 시부터 열한 시 사이에는 로비에 있었다고 진술.
    hidden_role: unaware
    presence:
      - slot: t0
        at: hall
      - slot: t1
        at: hall
      - slot: t2
        at: hall
    statement:
      gesture:
        pre: 의자를 조금 뒤로 물리고 앉았다.
        post: 시선이 잠깐 문 쪽으로 갔다.
      paragraphs:
        - >-
          정확하게 말하면, 저는 관객이 다 빠져나갈 때까지 로비를 지키는 게 일입니다. 마지막 공연이 끝난 직후에도 그랬습니다. 앞문을 걸어 잠그고 나면 그 다음은 계산이라, 매표구 옆
          탁자에 앉아 서류를 펴놓습니다.
        - 밤 열 시부터 열한 시 사이까지 자리를 뜨지 않았습니다. 미숙 선배가 옆에서 계속 말을 붙이는 통에 숫자를 두 번 다시 맞췄습니다.
        - 자정을 조금 넘긴 무렵에도 그 자리를 지켰습니다. 여기 문 닫는다는 얘기가 나온 뒤로는 정리할 것이 더 늘었습니다.
  - id: p2
    name: 문선호
    age: 32
    job: 영사 기사
    claim_summary: 밤 열 시부터 열한 시 사이에는 극장 뒷마당에 있었다고 진술.
    hidden_role: unaware
    presence:
      - slot: t0
        at: hall
      - slot: t1
        at: approach
      - slot: t2
        at: hall
    statement:
      gesture:
        pre: 탁자 모서리를 손가락으로 짚었다.
        post: 말끝이 조금 흐려졌다.
      paragraphs:
        - >-
          제 기억으로는, 영사기 끄고 나면 열이 식을 때까지는 손을 못 댑니다. 그래서 마지막 공연이 끝난 직후에는 로비에 내려와 있었어요. 지배인님이 탁자에서 뭘 적고 계셨고, 저는 그냥
          소파 끝에 걸터앉아 있었습니다.
        - >-
          밤 열 시부터 열한 시 사이에는 극장 뒷마당에 가 있었어요. 로비에서 걸어서 2분 거리입니다. 담배 한 대 피우려고 나갔다가 좀 오래 있었네요. 뒷문 손잡이가 헐거워서 누가
          청테이프를 감아뒀더라구요. 그거 만지작거리면서 서 있었어요.
        - 자정을 조금 넘긴 무렵에는 로비로 옮겼습니다. 바깥이 생각보다 추워서요.
  - id: p3
    name: 조태식
    age: 35
    job: 의상 담당
    claim_summary: 밤 열 시부터 열한 시 사이에는 영사실에 있었다고 진술.
    hidden_role: unaware
    presence:
      - slot: t0
        at: hall
      - slot: t1
        at: loc2
      - slot: t2
        at: hall
    statement:
      gesture:
        pre: 발끝으로 바닥을 두어 번 눌렀다.
        post: 손등으로 이마를 문질렀다.
      paragraphs:
        - >-
          글쎄요, 그러니까, 저는 무대 옷부터 걷어야 하는 사람이라 공연 끝나면 제일 늦게까지 남습니다. 그래도 마지막 공연이 끝난 직후에는 로비에 있었어요. 걷어온 걸 소파에 산더미로
          쌓아놓고 앉아 있었죠. 미숙 누나가 그거 좀 치우라고 잔소리하는 게 매번 있는 일이구요.
        - >-
          밤 열 시부터 열한 시 사이에는 영사실에 가 있었습니다. 청테이프를 거기 두고 온 게 생각나서요. 옷단 터진 걸 급하면 그걸로 붙여놓거든요. 우리 극장에서 그게 없으면 되는 일이
          없습니다.
        - 자정을 조금 넘긴 무렵에는 로비로 옮겼구요. 옷을 그대로 두고 갈 수는 없으니까 다시 그 앞에 앉았죠.
  - id: p4
    name: 표미숙
    age: 38
    job: 매표 직원
    claim_summary: 밤 열 시부터 열한 시 사이에는 로비에 있었다고 진술.
    hidden_role: ringleader
    presence:
      - slot: t0
        at: hall
      - slot: t1
        at: room
      - slot: t2
        at: hall
    claim:
      - slot: t0
        at: hall
      - slot: t1
        at: hall
      - slot: t2
        at: hall
    statement:
      gesture:
        pre: 목을 한 번 가다듬었다.
        post: 대답이 끝나자 어깨가 조금 내려앉았다.
      paragraphs:
        - >-
          솔직히 말하자면, 저는 이십 년 가까이 저 매표구 안에만 앉아 있던 사람이에요. 매표구가 로비에 있으니 제 자리도 로비죠. 마지막 공연이 끝난 직후에도 거기 있었어요. 표 파는
          사람은 끝나고도 한참을 남아요. 관객보다 늦게 나가는 게 매표 직원이라고, 예전 지배인님이 그렇게 말했었죠.
        - >-
          밤 열 시부터 열한 시 사이까지도 자리를 뜨지 않았어요. 경석이가, 아니 지배인님이 옆에서 숫자를 맞추고 있길래 제가 커피를 타다 줬고요. 태식이가 옷을 저렇게 쌓아놓고 다니는
          것도 하루이틀이 아니라서 그 얘기도 했고. 준기는 원래 말이 없는 애라 뭘 물어도 대답이 짧아요. 선호씨는 담배 냄새를 달고 다니는데 본인만 모르는 것 같고요.
        - >-
          자정을 조금 넘긴 무렵에도 그 자리를 지켰어요. 저야 갈 데가 없으니까. 문 닫는다는 얘기 나온 뒤로 다들 말수가 줄었는데, 그렇게 조용한 극장은 저도 처음 봤어요. 이십 년을
          다녔는데 마지막이 이런 식이 되는 게 맞나 싶고.
  - id: p5
    name: 서준기
    age: 33
    job: 영사 기사
    claim_summary: 밤 열 시부터 열한 시 사이에는 무대에 있었다고 진술.
    hidden_role: unaware
    presence:
      - slot: t0
        at: hall
      - slot: t1
        at: loc1
      - slot: t2
        at: hall
    statement:
      gesture:
        pre: 소맷단을 접었다 폈다 했다.
        post: 마지막 말은 목소리가 반쯤 잠겼다.
      paragraphs:
        - 그날 일이라면, 마지막 공연이 끝난 직후에는 로비에 있었습니다. 다들 거기 있었으니까요.
        - 밤 열 시부터 열한 시 사이에는 무대에 가 있었습니다. 스크린 밑단이 말려 올라간 걸 청테이프로 눌러놓으려고요. 그거 안 하면 다음 상영 때 화면 아래가 접힙니다.
        - 자정을 조금 넘긴 무렵에는 로비로 옮겼습니다.
