      다인이 모든 것을 털어놓으려 하자, 세라는 폭로가 임박했음을 알았다.
      새벽, 그는 별채에서 연탄을 들고 본채로 향했다.
      증거는 별채의 대포폰 안에 잠들어 있었다.

reopen_per_chapter: 1


# ─────────────────────────────────────────────────────────────────────
#  정보 공개
# ─────────────────────────────────────────────────────────────────────
#  트리거는 둘뿐이다 — 장 완성, 조사 실행. 공란 단위 트리거는 잠금과 충돌한다.
#
#  yield: path 결정적 / narrow 좁힘 / decoy 참이지만 무관 / flavor 분위기
#  ★ decoy 는 fact 를 주면 안 된다 ★ — 주는 순간 필수 경로가 되어 함정이 아니게 된다.
#
#  ⚠ 미해결: 장 완성 공개가 1·2·3장에 있는데 프로토타입은 1·2·4장이다.
#     전환 4번 중 하나는 도착물이 0개다. 인터루드 구현 전에 맞춰야 한다.
#     (docs/MEMORY.md 「그 밖의 미해결」 참조)

reveals:
  - trigger: { on: chapterComplete, chapter_order: 1 }
    yield: path
    facts: [f_cause]
    actions: [a_annex]
    surface: overview
    # 두 가지가 동시에 도착한다. 어느 쪽도 먼저 놓거나 강조하지 않는다 —
    # 순서가 곧 '다음에 필요한 것' 신호가 되면 유용도 누설이다
    narration: >-
      이른 오후, 부검 예비 소견이 올라왔다.
      그리고 본채에서 도보 십 분 거리에 별채가 하나 더 있다는 것을 뒤늦게 들었다.

  - trigger: { on: chapterComplete, chapter_order: 2 }
    yield: decoy
    surface: statement
    add_claims:
      - { speaker: yuri, content: 새벽에 다인 언니가 저한테도 전화를 했었어요, target: statement }
    narration: 마지막 정황을 정리하자, 오나경이 머뭇거리며 덧붙였다.

  - trigger: { on: action, action_id: a_autopsy }
    yield: narrow
    surface: overview
    # 격자 슬롯은 t2(3~8시)가 최소 단위다. 3~5시라는 정밀도는 narration 이 갖는다
    narrows_window: [t1, t2]
    narration: 부검 결과 사망 시각이 새벽 3시에서 5시 사이로 좁혀졌다.

  - trigger: { on: chapterComplete, chapter_order: 3 }
    yield: decoy
    surface: statement
    add_claims:
      - { speaker: yena, content: 나경 걔가 요즘 돈 문제로 힘들다고 했었어요, target: statement }
    narration: 현장 정리가 끝나자 서지안이 조심스레 말을 보탰다.

  - trigger: { on: action, action_id: a_briquette }
    yield: path
    surface: map
    narration: 연탄에서 나온 영수증. 구매자는 별채 거주자였다.
