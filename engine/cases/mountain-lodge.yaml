# =====================================================================
#  산장 살인사건 — 골든 케이스
# =====================================================================
#  이 파일이 사건의 정본이다. 검증: npm run verify
#  저작법은 ../templates/README.md, 빈 서식은 ../templates/case-template.yaml
#
#  실제 오프라인 플레이 기록: 조사 4~5회로 해결
# =====================================================================

id: mountain-lodge
title: 산장 살인사건
scale: campaign
# 2026-07-24 플레이테스트 후 5 → 6.
# 필수 3 · 오라클 4 · 탐욕 7(레드 헤링 셋을 먼저 다 밟는 경로).
# 6이면 레드 헤링 하나까지는 감당하고 둘부터 실패한다 — 그 선이 의도다.
budget: 6

incident:
  kind: homicide
  subject: chaewon
  description: 산장 장기 투숙 중이던 소설가가 위장 자살로 살해됨
  # 사건 현장. 무고한 자가 사망 시간대에 여기 있으면 기회가 생겨 유일성이 무너진다
  scene: room
  # 브리핑이 확정 층으로 내놓는 관찰. 조사 없이 보이는 것만 적는다.
  # body_state 는 시신 외관이다 — 부검 소견(f_cause)은 available_after: 1 이라 오지 않는다.
  # scene_state 는 seed_terms(테이프·연탄)의 서술형이고, 검증기가 그 밖의 단어를 막는다.
  body_state: { ko: "외상 없음" }
  scene_state: { ko: "방문·창가 테이프, 화로에 연탄" }

prose:
  source: authored

# 진술 정독만으로 확보되는 단어. 조사가 필요 없다.
# 지안의 진술이 테이프를, 프롤로그와 발견 정황이 연탄(화로)을 이미 말한다.
# 이것이 없으면 1장(조사 없이 확정돼야 하는 장)의 은폐수단 공란을 채울 수 없어
# 시작하자마자 막힌다.
seed_terms: [테이프, 연탄]


# ─────────────────────────────────────────────────────────────────────
#  확보 단어 사전
# ─────────────────────────────────────────────────────────────────────
#  보고서 오른쪽 「확보 단어」 은행에서 칩을 누르면 뜨는 내용.
#  source = 어디서 나왔나 · note = 무엇이었나.
#
#  ★ 3인칭 관찰만 적는다 ★ 「~를 뜻한다」·「따라서 ~다」 금지.
#  해석은 플레이어의 일이고, 여기에 뜻을 적으면 물증 카드의 `뜻` 필드와
#  같은 실패가 된다 (절대 규칙에 일곱 번째로 재발한 그것).
#
#  아홉은 프로토타입 `TERM_INFO`(1516행)에서 옮겼다 — 영문까지 이미 쓰여 있었다.
#  `영수증`·`물자국` 둘은 **프로토타입에 없다** — 트릭 재작업으로 엔진에만
#  생긴 물증이라 여기서 새로 썼고, 각 물증의 `record` 를 그대로 줄였다.

terms:
  - word: 테이프
    source: { ko: 다인의 방 · 방문·창가, en: "Da-in's room · door & window" }
    note: { ko: 문틈과 창문 가장자리가 안쪽에서 발라져 있었다., en: The door and window edges were taped over from the inside. }
  - word: 연탄
    source: { ko: 다인의 방 · 화로, en: "Da-in's room · brazier" }
    note: { ko: 방 안 화로에서 타고 있었다., en: It was burning in a brazier inside the room. }
  - word: 일산화탄소 중독
    source: { ko: 시신 정밀 검사, en: Detailed autopsy }
    note: { ko: "외상은 없고, 혈중 일산화탄소 농도가 높았다.", en: "No external wounds; blood carbon-monoxide levels were high." }
  - word: 유서
    source: { ko: 소지품 검사 · 문세라, en: Belongings · Se-ra }
    note: { ko: "완성되지 않은 초안이었고, 필체가 원고와 달랐다.", en: "An unfinished draft; the handwriting differed from the manuscript." }
  - word: 김선생
    source: { ko: 별채 수색 · 소지품 검사, en: Annex search · belongings }
    note: { ko: 여러 기록에 반복 등장하는 호칭이었다., en: A name that recurs across several records. }
  - word: 마약
    source: { ko: 소지품 검사, en: Belongings search }
    note: { ko: 작은 봉지 여러 개로 나뉘어 있었다., en: Divided into several small bags. }
  - word: 폭로 임박
    source: { ko: 별채 수색 · 소지품 검사, en: Annex search · belongings }
    note: { ko: 기록에 남은 메시지가 같은 시점을 가리켰다., en: Messages in the records pointed to the same moment. }
  - word: 별채 대포폰
    source: { ko: 별채 수색, en: Annex search }
    note: { ko: "가입자 정보가 없었고, 저장된 번호는 하나뿐이었다.", en: "No subscriber on record; only one number was saved." }
  - word: 치정
    source: { ko: 진술 정황, en: Statement context }
    note: { ko: 진술에 관련 정황이 있었다., en: Related context appeared in statements. }
  # 아래 둘은 프로토타입에 없다 — 엔진 전용 물증(e_receipt · e_dryice)에서 새로 썼다
  - word: 영수증
    source: { ko: 다인의 방 · 화로 재 속, en: "Da-in's room · in the brazier ash" }
    note: { ko: "타다 만 조각이었고, 발행 시각이 전날 오후로 찍혀 있었다.", en: "A partly burned scrap; the issue time read the previous afternoon." }
  - word: 물자국
    source: { ko: 다인의 방 · 화로, en: "Da-in's room · brazier" }
    note: { ko: 재 아래 바닥에 둥근 자국이 남아 있었다. 연탄재는 그 위에 덮여 있었다., en: "A round mark on the floor beneath the ash, with the ash lying over it." }


# ─────────────────────────────────────────────────────────────────────
#  프롤로그
# ─────────────────────────────────────────────────────────────────────
#  ★ 브리핑과 진술에 이미 있는 사실만 다룬다. 새 정보는 0. ★
#  분위기 살리려고 "그녀는 위험한 일에 연루되어 있었다" 한 줄 넣으면
#  조사로 얻어야 할 정보가 무료로 풀리고 난이도가 무너진다.
#  트릭의 허점을 복선으로 심는 것은 허용된다 — 이미 진술에 있는 정보이므로.
#
#  문장은 "한 줄" 또는 { ko: …, en: … }. en 이 없으면 번역 전이다.

prologue:
  - 산길 끝에 산장이 하나 있다. 윤다인은 그곳에서 넉 달째 지내고 있었다. 소설을 쓰기 위해서였지만, 최근 그녀가 완성한 원고는 없었다.
  - 분위기를 바꿔보려 했는지, 다인은 오랜만에 옛 지인들을 불러 모았다. 초대장은 전날 밤에 돌았고, 다섯 사람이 답했다.
  - 그날 아침, 가장 먼저 도착한 두 사람이 창밖으로 새어 나오는 연기를 보았다. 방문은 잠겨 있지 않았는데도 열리지 않았다.
  - 문이 열렸을 때, 윤다인은 이미 숨을 쉬지 않았다.


# ─────────────────────────────────────────────────────────────────────
#  시간 축
# ─────────────────────────────────────────────────────────────────────
#  presence · claim · 시각 공란이 이 어휘만 쓴다.
#  진술 격자의 열이기도 하므로 너무 잘게 쪼개지 않는다.

slots:
  - { id: t0, label: 전날 밤 }
  - { id: t1, label: 새벽 3시 }
  - { id: t2, label: 새벽 3~8시, window: true }
  - { id: t3, label: 오전 }


# ─────────────────────────────────────────────────────────────────────
#  장소
# ─────────────────────────────────────────────────────────────────────
#  presence · claim · 장소 공란이 이 어휘만 쓴다.
#  자유 문자열로 두면 'annex' 와 '별채' 가 서로 다른 곳이 되고 아무도 모른다.
#
#  at_lodge: false = 산장 부지 밖. 사망 시간대에 거기 있으면 현장 접근이 불가능하다.

locations:
  - { id: main,     label: 본채,     at_lodge: true }
  - { id: room,     label: 다인의 방, at_lodge: true }   # ← 사건 현장
  - { id: annex,    label: 별채,     at_lodge: true }
  - { id: approach, label: 진입로,   at_lodge: true }
  - { id: home,     label: 자택,     at_lodge: false }


# ─────────────────────────────────────────────────────────────────────
#  현장 평면도
# ─────────────────────────────────────────────────────────────────────
#  프로토타입 `GEO`(추리게임.dc.html 2329행)를 그대로 옮겼다. 좌표는 view_box 안의 값.
#
#  ★ 도면은 판정하지 않는다 ★ 확대·화살표·펄스로 「여길 봐」를 만들지 않는다.
#  별채는 1장 완성 전까지 나타나지 않지만, 나타난 뒤에는 제자리에 그냥 있다.
#
#  rooms·zones 의 loc 은 위 locations 를 가리킨다. 검증기가 그 참조를 검사한다.

floor_plan:
  view_box: { w: 1000, h: 625 }
  scale: { x: 96, len: 90, y: 585, label: 5m }

  buildings:
    - { id: main,  x: 70,  y: 60, w: 532, h: 485, poche: var(--fg-3) }
    # 1장을 완성해야 도면에 나타난다. 그전엔 존재 자체가 보이지 않는다
    - { id: annex, x: 712, y: 66, w: 228, h: 150, poche: var(--accent), revealed_after: 1 }

  rooms:
    # 사건 현장. 옅은 붉은 기가 깔린다 — 상태 표시이지 강조가 아니다
    - { id: vroom,     building: main,  loc: room,  x: 70,  y: 60,  w: 260, h: 485, label: 다인의 방, scene: true, tint: "rgba(235,87,87,.10)", primary: true }
    - { id: living,    building: main,  loc: main,  x: 330, y: 60,  w: 272, h: 270, label: 거실, primary: true }
    - { id: kitchen,   building: main,  loc: main,  x: 330, y: 330, w: 272, h: 215, label: 부엌 }
    - { id: annexRoom, building: annex, loc: annex, x: 712, y: 66,  w: 228, h: 150, label: 별채, primary: true }

  zones:
    - { id: approachZ, loc: approach, x: 712, y: 430, w: 228, h: 140, label: 진입로, hatch: true, primary: true }
    - { id: homeZ,     loc: home,     x: 712, y: 250, w: 228, h: 120, label: "자택 (현장 밖)", offsite: true, primary: true }

  doors:
    - { id: roomdoor,  x1: 330, y1: 200, x2: 330, y2: 280, hinge: p2, swing: -1, label: 방문, lx: 370, ly: 240 }
    - { id: ldoor,     x1: 430, y1: 330, x2: 510, y2: 330, open: true }
    - { id: front,     x1: 602, y1: 150, x2: 602, y2: 216, hinge: p2, swing: -1, ext: true, label: 정문, lx: 566, ly: 183 }
    - { id: back,      x1: 602, y1: 430, x2: 602, y2: 496, hinge: p2, swing: -1, ext: true, label: 후문, lx: 566, ly: 463 }
    - { id: annexdoor, x1: 712, y1: 124, x2: 712, y2: 158, hinge: p1, swing: -1, ext: true, building: annex, label: 문, lx: 700, ly: 182 }

  windows:
    - { x1: 150, y1: 60, x2: 258, y2: 60, label: 창문, lx: 204, ly: 51 }
    - { x1: 410, y1: 60, x2: 518, y2: 60, label: 창문, lx: 464, ly: 51 }
    - { x1: 820, y1: 66, x2: 890, y2: 66, building: annex, label: 창문, lx: 855, ly: 61 }

  # 건물 사이 도보. min 은 분. 세라의 진술("걸어서 10분")이 이 값과 맞아야 한다.
  # from·to 는 **장소**다 — 앱의 도보 시간표(WALK)가 장소 쌍이라 이것 없이는 못 채운다.
  # 여기서는 building 과 to 가 우연히 같은 낱말이지만(annex 가 건물이자 장소),
  # 생성 사건은 건물이 b_annex 고 장소가 loc3 이라 갈린다
  walks:
    - { building: annex,    from: main, to: annex,    x1: 602, y1: 140, x2: 712, y2: 140, min: 10 }
    - { building: approach, from: main, to: approach, x1: 602, y1: 500, x2: 712, y2: 500, min: 2 }

  # 눌러서 조사하는 고정물. 키는 조사 대상 id
  # label = 도면 위 한국어 이름표. 영문은 아직 앱에 있다 (로마자 표기 미결)
  # loc 은 그 고정물이 어느 장소의 것인가. 없으면 앱이 revealedLocs 로 걸러 안 그린다.
  # body 는 시신 표식 — 앱이 이것만 붉게 그리고 누르면 autopsy 를 돌린다.
  # 키가 body 여야 한다(앱 targetKey 가 부검 키를 언제나 'body' 로 만든다)
  fixtures:
    hearth: { x: 200, y: 415, label: 화로,   loc: room }
    window: { x: 204, y: 76,  label: 테이프, loc: room }
    safe:   { x: 466, y: 205, label: 금고,   loc: main }
    body:   { x: 200, y: 300, label: 시신,   loc: room, body: true }


# ─────────────────────────────────────────────────────────────────────
#  인물과 동선
# ─────────────────────────────────────────────────────────────────────
#  presence = 실제 동선(진실). claim = 진술에서 주장하는 동선.
#
#  ★ claim 을 적지 않으면 presence 와 같다. ★
#  즉 "무고한 사람은 거짓말하지 않는다"가 규약이 아니라 기본값이다.
#  거짓말은 명시적으로 적어야 하고, 검증기가 범인 외에는 적지 못하게 막는다.
#
#  실존 인물명은 쓰지 않는다. (2026-07-24 교체 완료)

# ── 관계 도식 ────────────────────────────────────────────────────────
#  프로토타입 GRAPH_NODES · GRAPH_EDGES · GRAPH_EVIDENCE(2265~2284행) 그대로.
#
#  ★ 좌표는 저작이다 ★ 자동 배치를 쓰지 않는다 — 매번 다르게 그려지면
#  밀집도가 곧 「여기가 중요하다」가 된다. 0~100 백분율.
#
#  ★ 아직 안 드러난 관계는 흐리게가 아니라 없다 ★
#  흐린 선은 「저기 뭔가 있다」이고, 그건 조사 0회에 사건의 크기를 알려주는 것이다.
relation_graph:
  nodes:
    - { id: victim,   kind: victim, label: { ko: 윤다인, en: Yoon Da-in }, x: 50, y: 50 }
    - { id: yena,     kind: person, x: 22, y: 22 }
    - { id: yujin,    kind: person, x: 50, y: 15 }
    - { id: sakura,   kind: person, x: 80, y: 30 }
    - { id: yuri,     kind: person, x: 82, y: 72 }
    - { id: wonyoung, kind: person, x: 24, y: 78 }
    # 마약망은 4장을 완성해야 **나타난다**. 그전에는 도식에 없다
    - { id: ring, kind: secret, label: { ko: "마약망 '김선생'", en: "Ring 'Kim'" }, x: 62, y: 88, revealed_after: 4 }

  edges:
    - { from: sakura,   to: ring,   label: { ko: 정체,      en: Is },       revealed_after: 4, danger: true }
    - { from: ring,     to: victim, label: { ko: 폭로 임박, en: Exposure }, revealed_after: 5, danger: true }
    - { from: wonyoung, to: ring,   label: { ko: 추적,      en: Tracing },  revealed_after: 4 }

  # 조사로 열리는 관계. 같은 짝의 위 간선을 덮어쓴다
  discoveries:
    - { action: a_yuri,  from: yuri,     to: ring,   label: { ko: 약물 정황,      en: Drug link } }
    - { action: a_ph_wy, from: wonyoung, to: victim, label: { ko: 새벽 통화 확인, en: Call verified } }
    - action: a_annex
      node: { id: burner, label: { ko: 대포폰, en: Burner }, x: 88, y: 62 }
      from: burner
      to: sakura
      label: { ko: 소지, en: Owned by }
      danger: true
    - action: a_sakura
      node: { id: note, label: { ko: 위장 유서, en: Fake note }, x: 62, y: 40 }
      from: note
      to: sakura
      label: { ko: 작성, en: Written by }
      danger: true

people:
  - id: sakura
    name: 문세라
    claim_summary: "전날 밤 본채에서 음주 후 별채에서 잤고, 오전까지 계속 잤다고 진술."
    age: 32
    sex: 여
    job: 산장지기
    hidden_role: ringleader
    presence:
      - { slot: t0, at: main }
      - { slot: t1, at: annex }
      - { slot: t2, at: room }     # ← 범행
      - { slot: t3, at: room }     # ← 발견 소동이 끝날 때까지 문 뒤에 있었다
    claim:
      - { slot: t0, at: main }
      - { slot: t1, at: annex }
      - { slot: t2, at: annex }    # ← 거짓말
      - { slot: t3, at: annex }    # ← 거짓말
    # 진술 원문. 주장의 내용은 위 claim 에서 나오고 여기엔 말투와 성격만 담긴다.
    # 3문단째가 claim(t2·t3 = 별채)을 말로 옮긴 것이다 — 이 사건의 유일한 거짓말.
    statement:
      # 지문 — 몸짓과 시선만. 사실을 새로 쓰지 않는다.
      # 다섯 사람 전원이 pre·post 한 쌍씩 갖는다. 검증기가 균등성을 강제한다 —
      # 넷은 담담하고 하나만 불안하면 지문이 곧 범인 표시가 되기 때문이다.
      gesture:
        pre: { ko: "세라는 빈 잔을 만지작거렸다." }
        post: { ko: "그러고는 잠깐, 창밖으로 시선을 돌렸다." }
      paragraphs:
        - "저는 지금 아이돌 하다가 망하고 공적인 일을 하고 싶지 않아서 다인이 글쓰는거 도와주면서 지내고 있어요. 말이 산장지기지 그냥 다인이가 어질러둔거 좀 치워주고. 먹을꺼 정도 챙겨주는 정도만 하면되는데. 다인이가 벌어둔게 많아서 페이를 많이 챙겨줘서 지낼만 했죠. 그 이외에는 제가 좋아하는 게임 하면서 지내면 되니까 이만큼 좋은 직장이 있을까요?"
        - "다인이가 같은 공간에서 지내는거 별로 안좋아해서 전 별채에서 지내고 있어요. 여기서 그다지 멀지 않은데.. 한 걸어서 10분거리 정도?"
        - "어제 새벽까지 둘이 술 마시다가 뭐 영감이 왔다 어쩐다 하면서 내쫒길래 저는 별채에 돌아와서 잠들었어요. 오랜만에 많이 마셔서 그런지 잠이 잘 오더라구요. 경찰들이 올때까지 저는 계속 자고있었습니다."

  - id: yena
    name: 서지안
    claim_summary: "오전에 도착해 가장 먼저 연기를 발견했다고 진술."
    age: 31
    sex: 여
    job: 댄스 강사
    hidden_role: investigator
    presence:
      - { slot: t3, at: main }
    statement:
      # 프로토타입 원문은 「지안는」이었다 — 옛 이름 '예나는' 을 치환하면서
      # 조사가 따라가지 않은 것이다. 지안은 받침이 있으므로 '은'.
      gesture:
        pre: { ko: "지안은 팔짱을 낀 채 담담하게 말했다." }
        post: { ko: "그러고는 잠시 말을 골랐다." }
      paragraphs:
        - "요즘에는 소속사에서 춤 레슨을 하고있어요. 다인이가 오랜만에 지인들 모은다길래 초대 받아서 왔어요. 제가 도착했을때에 딱 마침 유빈이도 도착해서 오랜만에 인사를 나누고 있었는데, 창밖으로 무슨 연기같은게 나오고 있더라구요. 저는 또 다인이가 워낙 요리도 못하고 하니까 뭐 태워먹었나 싶었는데. 이게 방에서 나오고 있는거에요? 그래서 급하게 방문을 열려고 했는데. 문이 잠겨있지는 않았는데 이게 안에서 테이프 같은거라도 붙어있는지 아무리 밀고 당겨도 열리지가 않아서 유빈이랑 같이 문을 미니까 그제서야 열렸어요."
        - "문 열자마자 보인건 화로 같은데 피워져있는 연탄이랑 자욱한 연기.. 그리고 창가에도 붙어있는 테이프가 보이더라구요. 유빈이랑 마음이 통했는지 서로 들어가는걸 말리게 됐어요. 그대로 들어가면 위험할 것 같아서 숨참고 들어가서 내가 창문을 열테니까 유빈이보고 다인이를 들처업고 나오라고 지시했어요."
        - "하지만 다인이는 이미.. 숨을 쉬고 있지 않았어요. 몸도 싸늘하게 식어있는걸 보니까 죽은지 좀 된 것 같더라구요."

  - id: yujin
    name: 한유빈
    claim_summary: "요리를 도우러 일찍 도착, 지안과 함께 발견했다고 진술."
    age: 27
    sex: 여
    job: 아이돌
    hidden_role: investigator
    presence:
      - { slot: t3, at: main }
    # 2문단째가 트릭의 허점이 심긴 자리다 (trick.flaw.plantedIn 에 yujin 이 있다).
    # 자살할 사람이 왜 손님을 불렀는가 — 프롤로그의 '초대장은 전날 밤에 돌았고'가
    # 이 위화감의 복선이다.
    statement:
      gesture:
        pre: { ko: "유빈은 손끝으로 탁자를 두어 번 두드리며 입을 열었다." }
        post: { ko: "말끝이 조금 흐려졌다." }
      paragraphs:
        - "저는 아직도 아이돌을 하고있어요. 리원이는 얼마전에 다인언니랑 싸워서 가기 싫다고 해서 안왔구요. 나경언니가 다인언니 요리 못믿겠다면서 자기가 장을 봐올테니까 조금일찍와서 음식 준비하는거 도와달라고 해서 일찍 도착하게되었어요. 그 이후는 지안언니가 말한 그대로에요. 지안언니가 확실히 예전에 저처럼 추리 프로그램을 해서 그런지 상황 파악이 빠르더라구요."
        - "그런데 좀 이상하긴 해요. 자살할 생각인 사람이 우리를 왜 불렀을까요? 산장이라 너무 늦게발견될까봐 걱정됐던걸까요? 그리고 연탄도.. 좀 이상하고."

  - id: yuri
    name: 오나경
    claim_summary: "장을 보고 유빈과 함께 뒤늦게 도착했다고 진술."
    age: 29
    sex: 여
    job: 가수
    hidden_role: coerced
    presence:
      - { slot: t3, at: main }
    # 이 사람의 배제는 자기 진술("장 보고 아침 도착")에서 나온다. 태그라인이
    # 「모든 진술을 의심하라」였을 때 퍼즐이 안 풀렸던 이유가 정확히 이 문단이다.
    statement:
      # 프로토타입 원문은 「나경는」이었다 — 옛 이름 '유리는' 의 조사 잔재.
      # 나경은 받침이 있으므로 '은'.
      gesture:
        pre: { ko: "나경은 장바구니를 아직 내려놓지 못한 채였다." }
        post: { ko: "되묻는 목소리에 물기가 배어 있었다." }
      paragraphs:
        - "저는 아직 가수생활을 하고있어요. 다인언니가 불렀을때부터 요리는 제가 대신해야겠다 생각하고있었죠. 세라언니가 옆에 있는거 알긴하는데 어차피 둘 요리실력이 거기서 거기니까.. 기왕 놀러가는김에 맛있는거 먹으면 좋잖아요?"
        - "멤버들 몇명이나 올지 몰라서 준비하려면 꽤 여유있게 준비해야하니까 유빈이한테 도와달라고 연락 미리해놓고.. 장봐와서 도착했는데 이게 도대체 무슨일이에요..?"

  - id: wonyoung
    name: 백리원
    claim_summary: "새벽 3시 피해자의 전화를 받고 늦잠 후 늦게 출발했다고 진술."
    age: 26
    sex: 여
    job: 아이돌
    hidden_role: investigator
    presence:
      - { slot: t1, at: home }
      - { slot: t2, at: home }
      - { slot: t3, at: approach }
    statement:
      gesture:
        pre: { ko: "리원은 휴대폰을 두 손으로 감싸 쥐었다." }
        post: { ko: "화면을 몇 번 더 확인했다." }
      paragraphs:
        - "새벽3시쯤에 다인언니한테 전화가 왔어요. 자기는 정말 모르는 일인데 너무 미안하다고. 자기도 세라언니한테 받은거였다고. 그래서 어차피 언니 둘 다 여기있고. 오랜만에 다들 모이니까 다 있는데서 사실을 확인하려고 왔어요. 그... 그런 소문 모르세요? 요즘 연예계에 마약이 돌고있다는 소문이요. 저도 당할뻔 했거든요 그거."
        - "유빈언니가 출발할때 원래 슬쩍 같이 타고 오려고 했는데, 새벽에 다인언니 때문에 깨서그런가 피곤해서 늦잠을 자버렸지 뭐에요. 그래서 급하게 준비하고 출발했는데..."

victim: chaewon
# 피해자는 people(용의자 목록)에 넣지 않는다 — 검증기가 유죄를 계산해버린다.
# 다만 브리핑·프롤로그·결말이 이름을 부르므로 표시 정보는 여기 둔다.
victim_profile: { name: 윤다인, age: 30, job: 소설가 }
culprit: sakura

# ─────────────────────────────────────────────────────────────────────
#  트릭
# ─────────────────────────────────────────────────────────────────────
#  트릭은 이름표가 아니라 계약이다. 아키타입마다 요구하는 부품이 다르고
#  검증기가 강제한다. 생성기도 같은 계약을 채워서 만든다.
#
#  ★ illusion = 플레이어가 처음 믿게 되는 것 ★
#    각각 broken_by 가 반드시 하나 이상 있어야 한다.
#    깨지지 않는 인상이 하나라도 있으면 플레이어는 진실에 도달할 수 없다.
#
#  ★ exit = 범인이 현장을 떠난 방법 ★
#    staged_suicide·locked_room 은 현장이 닫혀 있다고 주장하므로 필수다.
#    2026-07-24 플레이테스트에서 터진 구멍이 정확히 이 부품의 부재였다.

trick:
  # 실제 추리물의 트릭은 대개 조합이다. 여기도 둘이 겹쳐 있다 —
  # 유서·밀폐(위장 자살) + 드라이아이스로 사망 시각 위장(알리바이 위조)
  types: [staged_suicide, alibi_fabrication]
  props: [e_briquette, e_tape, e_dryice]
  staging: [e_note]

  illusions:
    - id: il_suicide
      kind: death
      impression: 스스로 목숨을 끊었다
      made_by: [e_note, e_tape]
      broken_by: [e_note, e_tape_inside]

    - id: il_time
      kind: time
      impression: 발견 직전에 죽었다
      # 연탄 연기는 이미 다 빠진 상태였고, 발견 시점의 '연기'는 드라이아이스다
      made_by: [e_dryice]
      broken_by: [e_time, e_hearth_cold]

    - id: il_absent
      kind: absence
      impression: 범인은 밤새 별채에 있었다
      made_by: []
      broken_by: [e_receipt, e_burner]

  # 문 뒤에 숨어 있다가, 발견자들이 테이프를 떼고 화로를 끄는 사이 빠져나가
  # 별채로 돌아갔다. '별채에서 잤다'는 주장이 여기서 나온다.
  exit:
    slot: t3
    method: 발견 소동 중 문 뒤에서 이탈해 별채로
    enabled_by: [e_dryice]
    broken_by: [e_receipt, e_dryice]

  flaw:
    text: 자살할 사람이 왜 그날 손님들을 초대했는가
    # 허점은 반드시 실제로 심긴 자리를 가리킨다.
    # 자유 텍스트로 두면 작가 머릿속에만 있는 허점을 적을 수 있다.
    planted_in: [yujin, e_victim_phone]


# ─────────────────────────────────────────────────────────────────────
#  물증
# ─────────────────────────────────────────────────────────────────────
#  record 는 3인칭 관찰만 적는다.
#  '위조' '가명' '밀폐' 같은 목적·기능 판정어 금지 — 그것은 플레이어의 결론이다.
#
#  yields_terms = 이 물증을 확보하면 확보 단어에 들어오는 후보.
#  discovered 공란은 여기 있는 단어로만 채울 수 있다.

evidence:
  - id: e_burner
    description: 별채 대포폰
    found_at: 별채 · 게임기 뒤
    record: 저장된 번호는 하나. 이름 없이 '선생'이라고만 적혀 있었다.
    extra:
      kind: messages
      lines:
        - { side: in,  at: 11월 3일,  text: 이번이 마지막이에요 }
        - { side: out, at: 11월 3일,  text: 그건 네가 정하는 게 아니야 }
        - { side: in,  at: 11월 12일, text: 다인 언니한테 다 말할 거예요 }
    yields_terms: [별채 대포폰, 김선생, 폭로 임박]

  # ⚠ 기록이 비어 있어 9-8f 경고가 상주한다. **의도한 것이다** —
  # 금고를 무엇으로 만들지가 아직 미결이고(`MEMORY.md` §유서가 두 곳에서 나온다:
  # ① 열쇠 없으면 못 여는 잠긴 금고 ② 유서의 두 번째 경로 ③ 다른 것),
  # 그 결정 전에 기록을 쓰면 결정을 문장으로 먼저 내려버린다.
  - id: e_safes
    description: 별채 금고 두 개

  - id: e_note
    description: 유서
    found_at: 문세라 소지품
    record: 한 장짜리 손글씨. 서명은 윤다인. 책상의 원고 메모와 필체가 일치하지 않았다.
    is_staging: true
    yields_terms: [유서]

  - id: e_key
    description: 금고 열쇠

  - id: e_wy_text
    description: 리원 문자 — 가명의 정체
    yields_terms: [김선생, 마약, 폭로 임박]

  - id: e_yuri_threat
    description: 나경 문자 — 협박
    yields_terms: [마약, 치정]

  - id: e_yena_info
    description: 지안 소지품 — 연습생 제보

  - id: e_yujin_patch
    description: 파스
    found_at: 한유빈 소지품
    record: 개봉된 어깨용 파스 한 통. 처방전은 없었고 구매처를 묻자 대답하지 않았다.

  - id: e_receipt
    description: 타다 만 영수증
    found_at: 다인의 방 · 화로 재 속
    record: 연탄 두 장. 구매처는 산 아래 상회였고, 발행 시각이 전날 오후로 찍혀 있었다.
    yields_terms: [연탄, 영수증]

  # 발견 시점의 '연기'를 만든 것. 연탄 연기는 그때 이미 다 빠진 상태였다.
  - id: e_dryice
    description: 화로 바닥의 물자국
    found_at: 다인의 방 · 화로
    record: 재 아래 바닥에 둥근 물자국이 남아 있었다. 연탄재는 그 위에 덮여 있었다.
    yields_terms: [물자국]

  # at_scene = 조사 없이 현장에서 열람하는 물건. 아래 둘은 방에 들어선 순간 보인다.
  # 표식이 없으면 '주는 조사가 하나도 없는데 확보 단어를 주는 물증'이 되어
  # 검증기가 데이터 오류로 잡는다 — 실제로 그 통로로 green 이 뜬 적이 있다.
  - id: e_tape
    description: 테이프
    found_at: 다인의 방 · 방문과 창가
    record: 문틈과 창문 가장자리가 안쪽에서 막혀 있었다. 폭 5cm 청테이프를 두 겹으로 겹쳐 붙였다.
    at_scene: true
    yields_terms: [테이프]

  - id: e_briquette
    description: 연탄
    found_at: 다인의 방 · 화로
    record: 두 장이 완전히 탔고 재만 남았다. 화로는 방 한가운데로 옮겨져 있었다.
    at_scene: true
    yields_terms: [연탄]

  - id: e_time
    description: 정밀 사망 시각
    yields_terms: [일산화탄소 중독]

  - id: e_yuri_call
    description: 나경 통화내역 — 새벽 피해자와 통화
    record: 새벽 3시대에 윤다인과 오간 통화가 한 건 남아 있었다.

  - id: e_wy_call_log
    description: 리원 통화내역 — 새벽 3시 수신
    record: 새벽 3시에 윤다인의 번호로부터 걸려 온 통화가 한 건 남아 있었다.

  - id: e_mutual
    description: 지안과 유빈의 상호 보증
    record: 두 사람이 말한 도착 시각이 서로 맞물렸다. 진입로 폐쇄회로에도 함께 찍혔다.

  # 레드 헤링으로 의심을 산 인물은 자기 진술 말고 물증으로도 닫아야 한다.
  # 그를 범인으로 가정하면 자기 말은 거짓이 되어 배제가 통째로 사라지기 때문이다.
  - id: e_yuri_alibi
    description: 나경의 동선 확인
    record: 산 아래 상회의 결제 기록과 도착 시각이 이어졌다.

  - id: e_hearth_cold
    description: 화로가 식은 정도

  - id: e_tape_inside
    description: 테이프가 안쪽에서 붙여짐

  - id: e_victim_phone
    description: 피해자 휴대폰 — 초대 메시지 발신 기록


# ─────────────────────────────────────────────────────────────────────
#  사실
# ─────────────────────────────────────────────────────────────────────
#  검증기의 원자 단위. 유죄 = motive ∧ opportunity ∧ means.
#  revealed_by 가 비어 있으면 진술에서 무료로 얻는다.
#  ★ 핵심 사실은 획득 경로가 2개 이상이어야 한다 ★ — 하나뿐이면 그 조사를
#  안 고른 플레이어가 영영 막힌다. 검증기가 강제한다.

facts:
  # 무료 · 진술에서
  # 쉼표가 들어간 값은 반드시 인용한다 — flow 스타일 { } 안에서 쉼표는 구분자다
  - { id: f_sakura_opp, kind: opportunity, subject: sakura,
      content: "별채는 도보 10분, 새벽까지 피해자와 동석", revealed_by: [] }
  - { id: f_yena_no,  kind: no_opportunity, subject: yena,  content: 오전 8시 도착, revealed_by: [] }
  - { id: f_yujin_no, kind: no_opportunity, subject: yujin, content: 오전 8시 도착, revealed_by: [] }
  - { id: f_yuri_no,  kind: no_opportunity, subject: yuri,  content: 장을 보고 아침 도착, revealed_by: [] }
  - { id: f_wy_no,    kind: no_opportunity, subject: wonyoung, content: "늦잠, 가장 늦게 도착", revealed_by: [] }
  - { id: f_last_seen, kind: context, subject: sakura,
      content: 새벽 3시까지 본채에서 피해자와 음주, revealed_by: [] }
  - { id: f_wy_call, kind: context, subject: wonyoung,
      content: 새벽 3시 피해자의 전화를 받음, revealed_by: [] }

  # 1장 확인 후 무료 공개
  - { id: f_cause, kind: context, subject: chaewon,
      content: "외상 없음, 일산화탄소 중독", revealed_by: [], available_after: 1 }

  # 유료
  - id: f_alias_exists
    kind: context
    subject: sakura
    content: 가명을 쓰는 유통책이 존재한다
    revealed_by: [e_yuri_threat, e_yena_info, e_wy_text]
  - id: f_sakura_is_alias
    kind: identity
    subject: sakura
    content: 세라 = 가명의 주인
    revealed_by: [e_burner, e_wy_text]
  - id: f_sakura_means
    kind: means
    subject: sakura
    content: 유서 위조, 금고 열쇠, 연탄 구매
    revealed_by: [e_note, e_key, e_receipt]
  - id: f_sakura_motive
    kind: motive
    subject: sakura
    content: 분배금 다툼 + 폭로 임박
    revealed_by: []
    requires: [f_sakura_is_alias]

  # 레드 헤링 — 무고한 사람의 비밀. 수상해 보이지만 살인과 무관하다
  # 배제의 두 번째 층 — 물증이 받친다. 1장이 조사 없이 확정되어야 하므로
  # 위의 무료 배제는 그대로 두고, 확인 사실을 따로 얹는다.
  - { id: f_yena_ok,  kind: no_opportunity, subject: yena,  content: 도착 시각 상호 일치, revealed_by: [e_mutual] }
  - { id: f_yujin_ok, kind: no_opportunity, subject: yujin, content: 도착 시각 상호 일치, revealed_by: [e_mutual] }
  - { id: f_yuri_ok,  kind: no_opportunity, subject: yuri,  content: 결제 기록과 도착 시각이 이어짐, revealed_by: [e_yuri_alibi] }

  - { id: f_yuri_secret,  kind: context, subject: yuri,  content: 협박당하는 중,   revealed_by: [e_yuri_threat] }
  - { id: f_yena_secret,  kind: context, subject: yena,  content: 출처 추적 중,    revealed_by: [e_yena_info] }
  - { id: f_yujin_secret, kind: context, subject: yujin, content: 피해자를 의심 중, revealed_by: [e_yujin_patch] }


# ─────────────────────────────────────────────────────────────────────
#  조사
# ─────────────────────────────────────────────────────────────────────
#  ★ 범인의 salience 를 낮게 둔다 ★
#  가장 수상해 보이는 사람이 범인이면 게임이 안 된다.
#  여기서는 레드 헤링(나경 .9 · 지안 .8 · 유빈 .75)이 해답 조사(별채 .3 ·
#  세라 .35 · 리원 .5)보다 높다 — 눈에 띄는 것부터 찍는 플레이어는 실패하고
#  추론한 플레이어는 4~5회에 푼다. 의도된 설계다.

actions:
  - id: a_yuri
    label: 소지품 검사 · 오나경
    clues:
      - { person: yuri, slot: motive, text: "약물 투약 흔적 (협박 정황)" }
    verb: belongings
    cost: 1
    gives: [e_yuri_threat]
    salience: 0.9
    yield: redherring
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "약물 투약 흔적", en: "Traces of drug use" }
      body:  { ko: "나경의 소지품에서 약물 흔적이 나왔다. 부끄러운 비밀이지만 살인과는 무관하다.", en: "Signs of drug use in Na-kyung’s things - a shameful secret, unrelated to the murder." }
    target: { kind: person, id: yuri }
  - id: a_yena
    label: 소지품 검사 · 서지안
    clues:
      - { person: yena, slot: motive, text: "유통 경로 추적 메모" }
    verb: belongings
    cost: 1
    gives: [e_yena_info]
    salience: 0.8
    yield: redherring
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "출처 추적 메모", en: "Source-tracing notes" }
      body:  { ko: "지안이 유통 경로를 캐던 메모. 수상해 보이지만 범행과는 무관하다.", en: "Ji-an’s notes tracing the supply chain - suspicious-looking but unrelated." }
    target: { kind: person, id: yena }
  - id: a_yujin
    label: 소지품 검사 · 한유빈
    clues:
      - { person: yujin, slot: motive, text: "다인 의심 메모" }
    verb: belongings
    cost: 1
    gives: [e_yujin_patch]
    salience: 0.75
    yield: redherring
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "의심 메모", en: "Suspicion notes" }
      body:  { ko: "유빈이 파스 출처로 다인을 의심한 메모. 개인적 의심일 뿐이다.", en: "Yu-bin’s notes suspecting Da-in - a private hunch, nothing more." }
    target: { kind: person, id: yujin }

  # 사인은 부검으로만 확보된다 = 필수 조사. 비용 2면 여유가 0이 되어 1로 내렸다
  - id: a_autopsy
    label: 시신 정밀 검사
    verb: autopsy
    cost: 1
    gives: [e_time]
    salience: 0.7
    yield: exclusion
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "일산화탄소 중독 확정", en: "CO poisoning confirmed" }
      body:  { ko: "사인은 일산화탄소 중독. 외상과 약물 반응은 없다. 사망 추정이 새벽 3~5시로 좁혀졌다.", en: "Cause of death is CO poisoning; no wounds or drugs. The window narrows to 03:00-05:00." }
    target: { kind: fixture, id: body }

  # a_briquette(연탄 수색)은 2026-07-27 에 a_hearth 로 합쳤다 — 둘 다
  # fixture:hearth 라서 앱에서는 애초에 같은 조사 하나였다. a_hearth 가
  # e_receipt 를 게이트 없이 이미 주고 있었으므로 도달성은 그대로다.
  # ⚠ 「핵심 물증은 경로가 둘 이상」이라는 규약은 이 물증에서 깨졌다.
  #   두 경로가 같은 고정물에 걸려 있어 앱 입도에서는 애초에 하나였다.
  - id: a_wy
    label: 소지품 검사 · 백리원
    clues:
      - { person: wonyoung, slot: motive, text: "‘김선생’ 추적 정황" }
      - { person: sakura, slot: motive, text: "추적 중이던 번호와 일치하는 연락처" }
    verb: belongings
    cost: 1
    gives: [e_wy_text]
    salience: 0.5
    boosted_by: [{ fact: f_alias_exists, amount: 0.45 }]
    yield: solution
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "‘김선생’ 추적 메모", en: "Trace on “Kim”" }
      body:  { ko: "리원의 폰에 유통망 우두머리를 추적한 정황과 김선생 번호가 남아 있다.", en: "Ri-won’s phone holds a trace on the ring’s head and Kim’s number." }
    target: { kind: person, id: wonyoung }
  - id: a_sakura
    label: 소지품 검사 · 문세라
    clues:
      - { person: sakura, slot: means, text: "위장용 유서 초안·금고 열쇠" }
    verb: belongings
    cost: 1
    gives: [e_note, e_key]
    salience: 0.35
    boosted_by: [{ fact: f_sakura_is_alias, amount: 0.5 }]
    yield: solution
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "유서 초안과 금고 열쇠", en: "Draft note and safe key" }
      body:  { ko: "세라의 짐에서 윤다인 명의 유서 초안과 금고 열쇠가 나왔다. 위장에 쓰인 물건이다.", en: "A forged draft note in Da-in’s name and a safe key, found in Se-ra’s things." }
    target: { kind: person, id: sakura }
  - id: a_annex
    label: 별채 수색
    clues:
      - { person: sakura, slot: motive, text: "마약 유통망 ‘김선생’ 거래 기록 (별채 대포폰)" }
    verb: search
    cost: 1
    gives: [e_burner, e_safes]
    salience: 0.3
    available_after: 1
    boosted_by: [{ fact: f_alias_exists, amount: 0.4 }]
    yield: solution
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "대포폰 발견", en: "Burner phone" }
      body:  { ko: "별채 게임기 뒤에서 발신 전용 대포폰. ‘김선생’ 명의 거래 메시지가 남아 있다.", en: "A burner phone behind the annex game console, with dealing messages under the alias “Kim.”" }
    target: { kind: location, id: annex }

  # 통화내역
  - id: a_ph_yuri
    label: 통화내역 조회 · 오나경
    verb: phone
    cost: 1
    gives: [e_yuri_call]
    salience: 0.5
    yield: exclusion
    # 프로토타입에 대응 텍스트가 없어 새로 썼다 (2026-07-28 · PROSE-BRIEF 서식).
    # 2장 완성 때 본인이 덧붙인 주장(grid t1 「통화 중 (본인 주장)」)을 기록이 확인한다.
    # 짝인 a_ph_wy 와 같은 온도로 맞췄다 — 둘 다 exclusion 이고 한쪽만 길면 그게 유용도 표시다.
    result:
      title: { ko: "새벽 통화 기록", en: "Early-hours call log" }
      body:  { ko: "나경의 통화내역에 새벽 3시 무렵 윤다인과 오간 기록이 남아 있다. 본인이 덧붙인 말과 시각이 맞물렸다.", en: "Na-gyeong's call log shows a call with Da-in around 03:00. It lined up with the time she had volunteered." }
    target: { kind: person, id: yuri }
  - id: a_ph_wy
    label: 통화내역 조회 · 백리원
    clues:
      - { person: wonyoung, slot: opportunity, text: "새벽 3시 통화·기지국상 원거리" }
    verb: phone
    cost: 1
    gives: [e_wy_call_log]
    salience: 0.45
    yield: exclusion
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "새벽 3시 통화 확인", en: "03:00 call verified" }
      body:  { ko: "리원은 새벽 3시 윤다인과 통화했다. 기지국 기록상 산장에서 멀리 떨어져 있었다.", en: "Ri-won called Da-in at 03:00; cell records place them far from the lodge." }
    target: { kind: person, id: wonyoung }
  - id: a_ph_sakura
    label: 통화내역 조회 · 문세라
    verb: phone
    cost: 1
    gives: []
    salience: 0.3
    yield: empty
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "개인폰 깨끗함", en: "Personal phone is clean" }
      body:  { ko: "세라의 개인 명의 폰에는 특이사항이 없다. 개인폰만으로는 아무것도 드러나지 않는다.", en: "Nothing on Se-ra’s registered phone - the personal line alone reveals nothing." }
    target: { kind: person, id: sakura }
  - id: a_ph_yena
    label: 통화내역 조회 · 서지안
    verb: phone
    cost: 1
    gives: []
    salience: 0.35
    yield: empty
    target: { kind: person, id: yena }
  - id: a_ph_yujin
    label: 통화내역 조회 · 한유빈
    verb: phone
    cost: 1
    gives: []
    salience: 0.3
    yield: empty
    target: { kind: person, id: yujin }

  # 알리바이 대조
  - id: a_alibi_yy
    label: 알리바이 대조 · 서지안 × 한유빈
    clues:
      - { person: yena, slot: opportunity, text: "도착 시각 상호 일치" }
      - { person: yujin, slot: opportunity, text: "지안과 도착 시각 일치" }
    verb: alibi
    # 관계 도식에서 이 둘을 고르면 열린다. 매달 지점이 없어 target 이 아니다
    pair: [yena, yujin]
    cost: 1
    gives: [e_mutual]
    salience: 0.4
    yield: exclusion
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "지안 동선 일치", en: "Ji-an’s route checks out" }
      body:  { ko: "지안과 유빈의 도착 시각이 서로 일치한다. 두 사람 모두 오전에야 도착했다.", en: "Ji-an and Yu-bin’s arrival times corroborate - both arrived only in the morning." }
  - id: a_alibi_yr
    label: 알리바이 대조 · 오나경 × 한유빈
    clues:
      - { person: yuri, slot: opportunity, text: "동선 일치 — 사망 시간대 접근 불가" }
      - { person: yujin, slot: opportunity, text: "지안·나경과 동선 일치" }
    verb: alibi
    pair: [yuri, yujin]
    cost: 1
    gives: [e_yuri_alibi]
    salience: 0.3
    yield: exclusion
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "나경 동선 일치", en: "Na-kyung’s route checks out" }
      body:  { ko: "나경은 장을 보고 유빈과 함께 도착했다. 사망 추정 시간대 현장 접근이 불가능하다.", en: "Na-kyung shopped and arrived with Yu-bin - no access during the window." }

  # 장소
  # 화로에 트릭의 핵심 셋이 몰려 있다 — 영수증(시각) · 물자국(가짜 연기) · 식은 정도
  - id: a_hearth
    label: 화로 조사
    verb: fixture
    cost: 1
    gives: [e_hearth_cold, e_dryice, e_receipt]
    salience: 0.55
    yield: solution
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "화로 · 연탄 확인", en: "Brazier and briquette" }
      body:  { ko: "화로에 남은 연탄이 사인의 근원으로 확인됐다. 재 아래 바닥에는 둥근 물자국이 있었다.", en: "The briquette in the brazier is confirmed as the source of death; a round mark lay beneath the ash." }
    target: { kind: fixture, id: hearth }
  - id: a_window
    label: 문틈과 창가 조사
    verb: fixture
    cost: 1
    gives: [e_tape_inside]
    salience: 0.45
    yield: exclusion
    # 프로토타입 resultFor(1927행)에서 옮김
    result:
      title: { ko: "창문 밀폐 테이프", en: "Window taped shut" }
      body:  { ko: "창틀과 문틈에 안쪽에서 붙인 테이프. 밀폐 위장 장치다.", en: "Tape applied from inside the window frame and door gap - a sealing device." }
    target: { kind: fixture, id: window }
  # 주방·거실은 2026-07-27 에 「본채 수색」 하나로 합쳤다. 창고는 별채 수색
  # (a_annex)에 흡수됐다 — 셋 다 gives: [] 인 빈손 조사라 잃은 물증이 없다.
  # 게임이 제공하는 입도가 정본이다: 앱은 장소를 본채·별채·진입로로만 센다
  - id: a_main
    label: 본채 수색
    verb: search
    cost: 1
    gives: []
    salience: 0.25
    yield: empty
    target: { kind: location, id: main }
  - id: a_drive
    label: 진입로 수색
    verb: search
    cost: 1
    gives: []
    salience: 0.15
    yield: empty
    target: { kind: location, id: approach }

  # 피해자
  # 대상이 피해자다. 2026-07-27 이전에는 target 이 없어 **앱이 지목할 수 없었고**,
  # 이것이 주는 e_victim_phone 이 트릭 허점의 두 자리 중 하나라 앱에서는 허점을
  # 만날 길이 한유빈 하나뿐이었다. personIds 가 victim 을 포함하므로 대상 검사를 지난다
  - id: a_victim_bel
    label: 소지품 검사 · 피해자
    verb: belongings
    cost: 1
    gives: [e_victim_phone]
    salience: 0.5
    yield: exclusion
    target: { kind: person, id: chaewon }
    # 2026-07-27 신설. 3인칭 관찰만 — 「자살할 사람이 왜 초대했는가」는 적지 않는다.
    # 그것이 허점이고, 허점은 플레이어가 세우는 것이다.
    # 내용은 e_victim_phone.description 과 프롤로그(초대장은 전날 밤에 돌았고,
    # 다섯 사람이 답했다)의 재진술이다 — 새 사실을 넣지 않았다.
    result:
      title: { ko: 피해자 휴대폰, en: The victim's phone }
      body:  { ko: 전날 밤 다섯 사람에게 초대 메시지를 보낸 발신 기록이 남아 있었다., en: Outgoing records showed invitation messages sent to five people the night before. }
  - id: a_manuscript
    label: 원고 조사
    verb: fixture
    cost: 1
    gives: []
    salience: 0.25
    yield: empty
    target: { kind: fixture, id: safe }


# ─────────────────────────────────────────────────────────────────────
#  보고서 — 장과 공란
# ─────────────────────────────────────────────────────────────────────
#  장 순서 = 의존성 순서다. 사건 시간순과 다를 수 있고, 결말에서는
#  epilogue_order 로 재배열된다.
#
#  opening = 장이 열릴 때 뜨는 절차 한 줄. 서술자 3인칭.
#  ★ 제목이 말하는 것 이상을 말하면 안 된다 ★ — 답이나 조사 방향 금지.
#  전부 쓰거나 전부 비우거나 둘 중 하나다(검증기가 강제). 일부만 쓰면
#  그 유무 자체가 신호가 된다.

chapters:
  - order: 1
    title: 도착과 발견
    opening: 다섯 사람의 말은 모두 들었다. 먼저 그날 아침, 방문이 열리기까지를 적는다.
    requires_facts: [f_yena_no, f_yujin_no, f_yuri_no]
    blanks:
      - { label: 인물,   candidates: closed,     answer: yujin, particle: 이/가 }
      - { label: 인물,   candidates: closed,     answer: yena,  particle: 과/와 }
      - { label: 장소,   candidates: closed,     answer: room }
      - { label: 은폐수단, candidates: discovered, answer: 테이프, particle: "(으)로" }
    # 서술문 — 공란은 문장 안에 박힌다. 문자열은 텍스트, { blank: n } 은 위 blanks 의 n번째
    report:
      - "사건 당일 아침, 요리를 돕기로 한 "
      - { blank: 0 }
      - " 남들보다 일찍 산장에 도착했다. 뒤이어 도착한 "
      - { blank: 1 }
      - " 함께, 두 사람은 "
      - { blank: 2 }
      - "에서 새어 나오는 연기를 발견했다. 방문은 안에서 "
      - { blank: 3 }
      - " 막혀 있어 쉽게 열리지 않았다."
    epilogue_order: 1
    epilogue: >-
      그날 아침, 요리를 돕기로 한 사람과 뒤이어 도착한 사람이
      다인의 방에서 새어 나오는 연기를 보았다.

  - order: 2
    title: 마지막 정황
    opening: 방 안의 일은 정리됐다. 남은 것은 그 전날 밤이었다.
    requires_facts: [f_last_seen, f_wy_call]
    blanks:
      - { label: 마지막목격자, candidates: closed, answer: sakura }
      - { label: 시각,       candidates: closed, answer: t1 }
      - { label: 장소,       candidates: closed, answer: main }
      - { label: 인물,       candidates: closed, answer: wonyoung, particle: 은/는 }
    report:
      - "생전의 윤다인을 마지막으로 본 사람은 "
      - { blank: 0 }
      - "였다. "
      - { blank: 1 }
      - "까지 두 사람은 "
      - { blank: 2 }
      - "에서 함께 술을 마셨다. 한편 "
      - { blank: 3 }
      - " 같은 시각 피해자의 전화를 받았다고 진술했다."
    epilogue_order: 2
    epilogue: >-
      마지막으로 다인을 본 것은 세라였다. 새벽 3시, 두 사람은 본채에 함께 있었다.
      같은 시각, 리원의 전화가 울렸다.

  - order: 3
    title: 사인과 현장
    opening: 그날 밤의 자리는 채워졌다. 그러나 죽음이 어떻게 왔는지는 아직 한 줄도 적히지 않았다.
    requires_facts: [f_cause, f_sakura_means]
    blanks:
      - { label: 사인,     candidates: discovered, answer: 일산화탄소 중독 }
      - { label: 도구,     candidates: discovered, answer: 연탄,   particle: 을/를 }
      - { label: 은폐수단, candidates: discovered, answer: 테이프, particle: "(으)로" }
      - { label: 위장물,   candidates: discovered, answer: 유서,   particle: 을/를 }
    report:
      - "부검 결과 직접 사인은 "
      - { blank: 0 }
      - "으로 확인됐다. 범인은 화로에 "
      - { blank: 1 }
      - " 피워 방을 채우고, 문과 창을 "
      - { blank: 2 }
      - " 밀폐했다. 그리고 자살로 위장하기 위해 현장에 "
      - { blank: 3 }
      - " 놓아두었다."
    epilogue_order: 3
    epilogue: >-
      사인은 일산화탄소 중독이었다. 화로의 연탄이 방을 채웠고, 문틈의 테이프가
      공기를 막았다. 머리맡의 유서는 그럴듯했지만, 그 손으로 쓴 것이 아니었다.

  - order: 4
    title: 감춰진 사건
    opening: 현장은 설명됐다. 그러나 설명된 것은 방법뿐이었다.
    requires_facts: [f_alias_exists, f_sakura_is_alias]
    blanks:
      - { label: 물품,     candidates: discovered, answer: 마약,   particle: 이/가 }
      - { label: 정체,     candidates: discovered, answer: 김선생 }
      - { label: 협박대상, candidates: closed,     answer: yuri,   particle: 을/를 }
      - { label: 인물,     candidates: closed,     answer: wonyoung, particle: 이/가 }
      - { label: 인물,     candidates: closed,     answer: sakura }
    report:
      - "산장에 흘러들던 "
      - { blank: 0 }
      - " 사건의 이면을 드러냈다. 그것은 마약 유통망 "
      - { blank: 1 }
      - "의 것이었다. 조직은 "
      - { blank: 2 }
      - " 약물로 붙들어 두고 있었고, 며칠 전 "
      - { blank: 3 }
      - " 그 실체를 캐묻기 시작한 참이었다. 그리고 그 이름의 주인은 "
      - { blank: 4 }
      - "였다."
    epilogue_order: 4
    epilogue: >-
      그 산장에는 마약이 흐르고 있었다. 유통을 쥔 것은 김선생이라는 이름의
      누군가였고, 나경은 그 이름에 붙들려 있었다. 리원은 며칠 전부터 그 이름을
      캐고 있었다. 김선생은, 세라였다.

  - order: 5
    title: 범인과 동기
    opening: 이제 이름을 적는다. 그리고 그 이름이 왜 그래야 했는지도.
    requires_facts: [f_sakura_motive, f_sakura_opp]
    blanks:
      - { label: 인물,   candidates: closed,     answer: sakura, is_accusation: true }
      - { label: 동기,   candidates: discovered, answer: 폭로 임박, particle: "(으)로" }
      - { label: 은닉처, candidates: discovered, answer: 별채 대포폰 }
    report:
      - "모든 정황이 한 사람을 가리켰다. 진범은 "
      - { blank: 0 }
      - ". 그는 조직이 드러나는 것을 막으려는 "
      - { blank: 1 }
      - " 윤다인을 살해했고, 증거를 "
      - { blank: 2 }
      - "에 감췄다."
    epilogue_order: 5
    epilogue: >-
      다인이 모든 것을 털어놓으려 하자, 세라는 폭로가 임박했음을 알았다.
      새벽, 그는 별채에서 연탄을 들고 본채로 향했다.
      증거는 별채의 대포폰 안에 잠들어 있었다.

reopen_per_chapter: 1


# ─────────────────────────────────────────────────────────────────────
#  정보 공개
# ─────────────────────────────────────────────────────────────────────
#  트리거는 둘뿐이다 — 장 완성, 조사 실행. 공란 단위 트리거는 잠금과 충돌한다.
#
#  yield: path 결정적 / narrow 좁힘 / decoy 참이지만 무관 / flavor 분위기
#  ★ decoy 는 fact 를 주면 안 된다 ★ — 주는 순간 필수 경로가 되어 함정이 아니게 된다.
#
#  ⚠ 미해결: 장 완성 공개가 1·2·3장에 있는데 프로토타입은 1·2·4장이다.
#     전환 4번 중 하나는 도착물이 0개다. 인터루드 구현 전에 맞춰야 한다.
#     (docs/MEMORY.md 「그 밖의 미해결」 참조)

reveals:
  # ─────────────────────────────────────────────────────────────────
  #  2026-07-27 — 앱 REVEALS·CLAIM_REVEALS 를 여기로 옮겼다.
  #  갈리던 곳은 앱 문안을 택했다(플레이테스트를 거친 쪽이다).
  #  narration 은 앱에 대응 화면이 없다 — 장 인터루드를 만들 때 쓴다.
  # ─────────────────────────────────────────────────────────────────
  - trigger: { on: chapterComplete, chapter_order: 1 }
    yield: path
    facts: [f_cause]
    actions: [a_annex]
    surface: overview
    # 두 가지가 동시에 도착한다. 어느 쪽도 먼저 놓거나 강조하지 않는다 —
    # 순서가 곧 '다음에 필요한 것' 신호가 되면 유용도 누설이다
    narration: >-
      이른 오후, 부검 예비 소견이 올라왔다.
      그리고 본채에서 도보 십 분 거리에 별채가 하나 더 있다는 것을 뒤늦게 들었다.
    # 트릭의 허점이 심긴 세 번째 자리. 한유빈이 무심코 말하는 형태다
    add_claims:
      - { speaker: yujin, target: statement,
          content: 자살할 사람이 우리를 왜 불렀을까요? 초대장은 전날 밤에야 급하게 돌았어요. }

  - trigger: { on: chapterComplete, chapter_order: 2 }
    yield: decoy
    surface: statement
    # 같은 새벽 통화가 두 표면에 뜬다 — 진술은 말한 그대로, 격자는 짧은 라벨.
    # 격자 라벨에 '(본인 주장)' 이 붙는 이유: 확정 층이 아니라 주장 층이다
    add_claims:
      - { speaker: wonyoung, target: statement,
          content: "유빈 언니가 출발할 때 같이 타려 했는데, 새벽에 깨서 그런지 늦잠을 자버렸어요." }
      - { speaker: yuri, target: statement,
          content: "아 맞다, 저 그날 새벽에 잠깐 통화한 데가 있긴 한데… 그건 이 일이랑 상관없어요." }
      - { speaker: yuri, target: grid, slot: t1, content: 통화 중 (본인 주장) }
    narration: 마지막 정황을 정리하자, 오나경이 머뭇거리며 덧붙였다.

  - trigger: { on: action, action_id: a_autopsy }
    yield: narrow
    surface: overview
    # 격자 슬롯은 t2(3~8시)가 최소 단위다. 3~5시라는 정밀도는 narration 이 갖는다
    narrows_window: [t1, t2]
    narration: 부검 결과 사망 시각이 새벽 3시에서 5시 사이로 좁혀졌다.

  - trigger: { on: chapterComplete, chapter_order: 3 }
    yield: decoy
    surface: statement
    add_claims:
      - { speaker: yena, content: 나경 걔가 요즘 돈 문제로 힘들다고 했었어요, target: statement }
    narration: 현장 정리가 끝나자 서지안이 조심스레 말을 보탰다.

  - trigger: { on: action, action_id: a_hearth }
    yield: path
    surface: map
    narration: 연탄에서 나온 영수증. 구매자는 별채 거주자였다.

  # 4장은 엔진에 없었고 앱에만 있던 것이다 (2026-07-27 이관)
  - trigger: { on: chapterComplete, chapter_order: 4 }
    yield: path
    surface: statement
    add_claims:
      - { speaker: yuri, target: statement,
          content: 그 소문… 저도 어디서 흘러나온 건지 알 것 같아요. 세라 언니 쪽이었죠. }
    # 검증기가 요구해서 새로 썼다(2026-07-27) — 장 완성 공개는 **전부 서사를 갖거나
    # 전부 없거나**여야 한다. 셋만 있으면 서사의 유무가 곧 유용도 신호가 된다.
    # 2·3장과 같은 틀: [장이 닫히는 정황]하자, [인물]이 [태도] 덧붙였다
    narration: 감춰진 일들이 정리되자, 오나경이 잠시 망설이다 덧붙였다.
