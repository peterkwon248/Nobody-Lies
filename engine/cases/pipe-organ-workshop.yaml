people:
  - id: p1
    name: 남윤아
    age: 31
    job: 조율사
    claim_summary: 밤 9시부터 10시 사이에는 공방 식당에 있었다고 진술.
    hidden_role: unaware
    presence:
      - slot: t0
        at: hall
      - slot: t1
        at: hall
      - slot: t2
        at: hall
    statement:
      gesture:
        pre: 소매 끝을 접었다 폈다 하고 있었다.
        post: 접힌 소매를 그대로 둔 채 입을 다물었다.
      paragraphs:
        - >-
          제 기억이 맞다면, 저녁 식사가 끝난 직후에는 공방 식당에 있었습니다. 조율은 귀가 성한 낮에 몰아서 하고 저녁에는 손을 놓는 편이라, 그날도 식탁 한쪽에서 다음 날 손볼 순서만
          종이에 적고 있었습니다.
        - >-
          밤 9시부터 10시 사이까지도 그 자리를 뜨지 않았습니다. 난로 옆이 제일 따뜻해서 저는 겨울이면 늘 그쪽에 앉습니다. 보온병에 뜨거운 걸 받아다 두고 손이 식으면 한 번씩
          쥐는데, 손이 한 번 굳으면 다음 날 일이 통 안 되거든요.
        - 다음 날 아침 공방 문을 열었을 때에도 같은 자리에 있었습니다. 앉은 채로 졸다 깨다 했는데, 이런 걸 물으실 줄 알았으면 시계를 몇 번쯤 더 봐둘 걸 그랬습니다.
  - id: p2
    name: 서다현
    age: 36
    job: 설계 담당
    claim_summary: 밤 9시부터 10시 사이에는 금속 선반실에 있었다고 진술.
    hidden_role: unaware
    presence:
      - slot: t0
        at: hall
      - slot: t1
        at: loc3
      - slot: t2
        at: hall
    statement:
      gesture:
        pre: 마른침을 삼키고 나서야 천천히 말했다.
        post: 말을 끝내고 짧게 숨을 내쉬었다.
      paragraphs:
        - >-
          다시 생각해봐도, 저녁 식사가 끝난 직후에는 공방 식당에 있었습니다. 저는 도면을 그리는 사람이라 몸 쓰는 자리에는 잘 불려 가지 않습니다. 그래서 밥을 먹고도 한참을 그냥 앉아
          있었습니다.
        - >-
          밤 9시부터 10시 사이에는 금속 선반실에 가 있었습니다. 식당에서 걸어서 10분쯤 걸립니다. 치수가 하나 안 맞는 게 종일 걸려서, 종이로 따지느니 실물에 대보는 게 빠르겠다
          싶었습니다.
        - 다음 날 아침 공방 문을 열었을 때에는 다시 식당으로 옮겨 와 있었습니다. 밤새 선 채로 버텼더니 아침에는 다리가 저려서, 앉을 데를 찾아 들어온 셈입니다.
  - id: p3
    name: 오연희
    age: 32
    job: 목공 담당
    claim_summary: 밤 9시부터 10시 사이에는 공방 식당에 있었다고 진술.
    hidden_role: ringleader
    presence:
      - slot: t0
        at: hall
      - slot: t1
        at: room
      - slot: t2
        at: hall
    claim:
      - slot: t0
        at: hall
      - slot: t1
        at: hall
      - slot: t2
        at: hall
    statement:
      gesture:
        pre: 식은 잔을 두 손으로 감싸 쥔 채였다.
        post: 잔을 내려놓는 소리가 조금 컸다.
      paragraphs:
        - >-
          굳이 따지자면, 저녁 식사가 끝난 직후에는 공방 식당에 있었습니다. 나무 만지는 일은 해가 지면 접는 게 낫습니다. 종일 톱밥 날리는 데 서 있다 보면 저녁에 할 수 있는 건 앉아
          있는 것뿐입니다.
        - 밤 9시부터 10시 사이까지 자리를 뜨지 않았습니다. 식은 잔을 홀짝이다가 나중에는 그냥 들고만 있었으니, 그 시간에 제가 한 일이라고는 그게 전부입니다.
        - 다음 날 아침 공방 문을 열었을 때에도 그 자리를 지키고 있었습니다. 밤이 그렇게 긴 줄 몰랐는데, 지나고 나서 하나하나 되짚으려니 아직 실감이 잘 안 납니다.
  - id: p4
    name: 진병국
    age: 32
    job: 자재 관리인
    claim_summary: 밤 9시부터 10시 사이에는 공방 앞마당에 있었다고 진술.
    hidden_role: unaware
    presence:
      - slot: t0
        at: hall
      - slot: t1
        at: approach
      - slot: t2
        at: hall
    statement:
      gesture:
        pre: 묻는 사람 대신 문 쪽을 보며 대답했다.
        post: 대답이 끝나고도 시선은 문에 있었다.
      paragraphs:
        - >-
          몇 번을 말씀드렸지만, 저녁 식사가 끝난 직후에는 공방 식당에 있었습니다. 저는 들고 나는 것들을 챙기는 일을 맡고 있어서, 저녁에도 남은 게 있으면 밥상머리에서 그 궁리를 하게
          됩니다.
        - 밤 9시부터 10시 사이에는 공방 앞마당에 나가 있었습니다. 식당에서 걸어서 2분이면 닿는 거리입니다. 바깥에 세워둔 것들이 밤새 젖으면 곤란해서 한 번씩은 나가 봐야 합니다.
        - 다음 날 아침 공방 문을 열었을 때에는 식당 쪽으로 다시 들어와 있었습니다. 마당은 오래 서 있을 데가 못 됩니다. 손끝이 시려 오면 결국 안으로 들어오게 되더군요.
  - id: p5
    name: 도경석
    age: 32
    job: 오르간 제작자
    claim_summary: 밤 9시부터 10시 사이에는 목재 건조실에 있었다고 진술.
    hidden_role: unaware
    presence:
      - slot: t0
        at: hall
      - slot: t1
        at: loc1
      - slot: t2
        at: hall
    statement:
      gesture:
        pre: 등받이에 몸을 붙였다가 다시 앞으로 당겨 앉았다.
        post: 앉은 자세를 한 번 더 고쳤다.
      paragraphs:
        - 솔직히 말해서, 저녁 식사가 끝난 직후에는 공방 식당에 있었습니다. 오르간 한 대에 몇 해가 걸리는 일이라 저녁만큼은 머리를 비워둬야 하는데, 그날은 그게 영 안 됐습니다.
        - >-
          밤 9시부터 10시 사이에는 목재 건조실에 가 있었습니다. 나무가 덜 마른 채로 들어가면 몇 년 뒤에 소리가 틀어집니다. 보온병 하나 들고 들어가 앉아 있으면 한 시간은
          금방인데, 저는 그 방을 하루에도 몇 번씩 들여다보는 사람입니다.
        - 다음 날 아침 공방 문을 열었을 때에는 식당으로 옮겨 와 있었습니다. 그 사이 일을 순서대로 말하려니 자꾸 앞뒤가 뒤집히는데, 어디 있었는지만은 그대로 말씀드린 겁니다.
