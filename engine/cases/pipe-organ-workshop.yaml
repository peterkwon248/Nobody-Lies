    - alibi_fabrication
  props:
    - e_tool
  staging: []
  illusions:
    - id: il_absent
      kind: absence
      impression: 범인은 그 시각 현장에 없었다
      made_by: []
      broken_by:
        - e_trace
        - e_log
  flaw:
    text: 그 시각에 현장에 없었다면 왜 아침에 가장 먼저 알았는가
    planted_in:
      - p3
evidence:
  - id: e_tool
    description: 보온병
    found_at: 조율실
    record: 조율실 건반대 옆에 누워 있던 보온병. 뚜껑이 열려 있었고 안은 비어 있었다.
    yields_terms:
      - 보온병
  - id: e_toolmark
    description: 도구가 남긴 자국
    record: 왼쪽 뒤통수에 남은 눌린 자국. 모서리가 둥글고 단단한 것이 닿은 형태다.
    yields_terms:
      - 보온병
  - id: e_alias
    description: '''문재림'' 라는 이름의 기록'
    record: 서류 묶음에 섞여 있던 한 장. 처리자 자리에 '문재림'이라는 이름이 적혀 있다.
    yields_terms:
      - 문재림
  - id: e_alias2
    description: '''문재림'' 가 적힌 두 번째 기록'
    record: 장부에 한 번 더 나오는 '문재림'. 앞의 종이와 같은 이름이 같은 손글씨로 적혀 있다.
    yields_terms:
      - 문재림
  - id: e_motive
    description: 금전 기록
    record: 장부 뒷장에 사람별로 적힌 주고받은 돈의 내역. 지워지지 않은 줄이 남아 있다.
    yields_terms:
      - 채무 관계
  - id: e_mutual
    description: 넷의 상호 보증
    record: 밤 9시부터 10시 사이를 두고 네 사람의 말이 서로 어긋나지 않았다는 대조 결과.
  - id: e_herring1
    description: 개인적인 편지
    record: 남윤아의 가방에서 나온 접힌 편지. 받는 사람 자리가 비어 있다.
  - id: e_herring2
    description: 오래된 사진
    record: 서다현의 지갑에 끼워져 있던 사진. 가장자리가 닳아 있다.
  - id: e_herring3
    description: 접힌 영수증
    record: 오연희의 주머니에서 나온 접힌 영수증. 잉크가 번져 항목이 읽히지 않는다.
  - id: e_herring4
    description: 지워진 기록
