seed_terms:
  - 보온병
prologue:
  - 산 아래 파이프오르간 공방은 저녁 식사가 끝나면 조용해진다. 그날 밤도 다르지 않았다고 다섯 사람은 말한다.
  - 다음 날 아침 공방 문을 열었을 때, 조율실에서 하윤재가 발견됐다. 서른네 살, 목공 담당이었다.
  - 전날 밤 공방 안에 있던 사람은 다섯이다. 남윤아 · 서다현 · 오연희 · 진병국 · 도경석.
  - 기록은 그 다섯의 밤을 되짚는 데서 시작한다.
terms:
  - word: 보온병
    source: 조율실 수색 · 시신 검사
    note: 조율실 건반대 옆 바닥에 누워 있던 물건. 뚜껑이 열려 있었다.
  - word: 문재림
    source: 서류 조사 · 장부 조사
    note: 서류 한 장과 장부에 적혀 있던 이름.
  - word: 채무 관계
    source: 서류 조사
    note: 장부 뒷장에 사람별로 적혀 있던, 주고받은 돈의 내역.
  - word: 출입 명부
    source: 출입 명부 확인
    note: 공방 입구에 놓여 드나든 사람이 이름을 적는 종이.
  - word: 자재 반출 전표
    source: 자재 반출 전표 확인
    note: 자재를 내갈 때 한 장씩 끊어 남기는 종이.
  - word: 공정 일지
    source: 공정 일지 확인
    note: 그날 어디까지 작업했는지 적어두는 기록.
